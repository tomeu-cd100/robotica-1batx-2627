name: 'SA2-A el cicle es repeteix sense desquadrar-se'
version: 1
author: 'validacio'
steps:
  # Segon cicle: comenca a t = 9500 ms. Es comprova que les fases tornen
  # exactament amb les mateixes durades (loop net que crida les funcions en ordre).

  # t = 11500 ms: mig de la fase "cotxes passen" del 2n cicle (9500-13500).
  - delay: 11500ms
  - expect-pin: { part-id: uno, pin: 10, value: 1 }
  - expect-pin: { part-id: uno, pin: 9, value: 0 }
  - expect-pin: { part-id: uno, pin: 8, value: 0 }
  - expect-pin: { part-id: uno, pin: 11, value: 1 }
  - expect-pin: { part-id: uno, pin: 12, value: 0 }

  # t = 17000 ms: mig de la fase "vianants passen" del 2n cicle (15000-19000).
  - delay: 5500ms
  - expect-pin: { part-id: uno, pin: 8, value: 1 }
  - expect-pin: { part-id: uno, pin: 9, value: 0 }
  - expect-pin: { part-id: uno, pin: 10, value: 0 }
  - expect-pin: { part-id: uno, pin: 11, value: 0 }
  - expect-pin: { part-id: uno, pin: 12, value: 1 }
