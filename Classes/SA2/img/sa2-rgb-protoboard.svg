<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="t d">
  <title id="t">Muntatge del LED RGB de 4 potes a la protoboard</title>
  <desc id="d">Protoboard amb un LED RGB discret de 4 potes: la pota llarga (càtode comú) va amb un pont al carril blau de massa, que torna al GND de l'Arduino; cadascuna de les altres tres potes (R, G i B) passa per la seva resistència de 220 ohms que salta el canal central i arriba amb un cable de color als pins PWM 9, 10 i 11.</desc>
  <style>
    .fr{fill:#f6faf9;stroke:#d7e6e5;stroke-width:1.5}
    .bb{fill:#efe9df;stroke:#cfc4ae;stroke-width:1.5}
    .canal{fill:#e3dbc9}
    .hole{fill:#b9ad93}
    .wV{fill:none;stroke:#dc2626;stroke-width:3.5;stroke-linecap:round}
    .wVd{fill:none;stroke:#16a34a;stroke-width:3.5;stroke-linecap:round}
    .wB{fill:none;stroke:#2563eb;stroke-width:3.5;stroke-linecap:round}
    .wN{fill:none;stroke:#0e1b1c;stroke-width:3.5;stroke-linecap:round}
    .res{fill:none;stroke:#0e1b1c;stroke-width:2.4;stroke-linejoin:round}
    .leg{fill:none;stroke:#6b7280;stroke-width:2}
    .pad{fill:#ffffff;stroke:#0891b2;stroke-width:2}
    .padtxt{font:700 12px 'Consolas',monospace;fill:#0c6e70}
    .lbl{font:600 13px system-ui,'Segoe UI',sans-serif;fill:#0e1b1c}
    .lbl2{font:500 12px system-ui,'Segoe UI',sans-serif;fill:#475569}
    .board{fill:#0e7490;stroke:#155e75;stroke-width:2}
    .btxt{font:800 16px system-ui,sans-serif;fill:#ffffff}
    .pota{font:700 11px 'Consolas',monospace;fill:#475569}
  </style>
  <rect class="fr" x="1" y="1" width="758" height="558" rx="14"/>

  <!-- ================== PROTOBOARD ================== -->
  <rect class="bb" x="50" y="36" width="660" height="222" rx="8"/>
  <!-- carril de massa (blau, a dalt) -->
  <line x1="70" y1="56" x2="690" y2="56" stroke="#2563eb" stroke-width="2"/>
  <g class="hole">
    <circle cx="90" cy="70" r="2.6"/><circle cx="130" cy="70" r="2.6"/><circle cx="170" cy="70" r="2.6"/><circle cx="210" cy="70" r="2.6"/><circle cx="250" cy="70" r="2.6"/><circle cx="290" cy="70" r="2.6"/><circle cx="330" cy="70" r="2.6"/><circle cx="370" cy="70" r="2.6"/><circle cx="410" cy="70" r="2.6"/><circle cx="450" cy="70" r="2.6"/><circle cx="490" cy="70" r="2.6"/><circle cx="530" cy="70" r="2.6"/><circle cx="570" cy="70" r="2.6"/><circle cx="610" cy="70" r="2.6"/><circle cx="650" cy="70" r="2.6"/>
  </g>
  <text class="lbl" x="62" y="75" fill="#2563eb">−</text>
  <text class="lbl2" x="690" y="50" text-anchor="end">carril de massa (GND)</text>

  <!-- camp superior de forats -->
  <g class="hole">
    <circle cx="90" cy="100" r="2.6"/><circle cx="130" cy="100" r="2.6"/><circle cx="170" cy="100" r="2.6"/><circle cx="210" cy="100" r="2.6"/><circle cx="250" cy="100" r="2.6"/><circle cx="370" cy="100" r="2.6"/><circle cx="410" cy="100" r="2.6"/><circle cx="450" cy="100" r="2.6"/><circle cx="490" cy="100" r="2.6"/><circle cx="530" cy="100" r="2.6"/><circle cx="570" cy="100" r="2.6"/><circle cx="610" cy="100" r="2.6"/><circle cx="650" cy="100" r="2.6"/>
    <circle cx="90" cy="152" r="2.6"/><circle cx="130" cy="152" r="2.6"/><circle cx="170" cy="152" r="2.6"/><circle cx="210" cy="152" r="2.6"/><circle cx="410" cy="152" r="2.6"/><circle cx="450" cy="152" r="2.6"/><circle cx="490" cy="152" r="2.6"/><circle cx="530" cy="152" r="2.6"/><circle cx="570" cy="152" r="2.6"/><circle cx="610" cy="152" r="2.6"/><circle cx="650" cy="152" r="2.6"/>
  </g>
  <!-- canal central -->
  <rect class="canal" x="50" y="166" width="660" height="14"/>
  <!-- camp inferior de forats -->
  <g class="hole">
    <circle cx="90" cy="196" r="2.6"/><circle cx="130" cy="196" r="2.6"/><circle cx="170" cy="196" r="2.6"/><circle cx="210" cy="196" r="2.6"/><circle cx="410" cy="196" r="2.6"/><circle cx="450" cy="196" r="2.6"/><circle cx="490" cy="196" r="2.6"/><circle cx="530" cy="196" r="2.6"/><circle cx="570" cy="196" r="2.6"/><circle cx="610" cy="196" r="2.6"/><circle cx="650" cy="196" r="2.6"/>
    <circle cx="90" cy="232" r="2.6"/><circle cx="130" cy="232" r="2.6"/><circle cx="170" cy="232" r="2.6"/><circle cx="210" cy="232" r="2.6"/><circle cx="250" cy="232" r="2.6"/><circle cx="370" cy="232" r="2.6"/><circle cx="410" cy="232" r="2.6"/><circle cx="450" cy="232" r="2.6"/><circle cx="490" cy="232" r="2.6"/><circle cx="530" cy="232" r="2.6"/><circle cx="570" cy="232" r="2.6"/><circle cx="610" cy="232" r="2.6"/><circle cx="650" cy="232" r="2.6"/>
  </g>

  <!-- ========= LED RGB de 4 potes: R(270) · càtode(290, llarga) · G(310) · B(330) ========= -->
  <circle cx="300" cy="116" r="17" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
  <circle cx="293" cy="111" r="4" fill="#dc2626"/>
  <circle cx="307" cy="111" r="4" fill="#16a34a"/>
  <circle cx="300" cy="123" r="4" fill="#2563eb"/>
  <line class="leg" x1="270" y1="128" x2="270" y2="152"/>
  <line class="leg" x1="290" y1="130" x2="290" y2="152" stroke-width="2.8"/>
  <line class="leg" x1="310" y1="128" x2="310" y2="152"/>
  <line class="leg" x1="330" y1="128" x2="330" y2="152"/>
  <text class="pota" x="266" y="147" text-anchor="end">R</text>
  <text class="pota" x="286" y="147" text-anchor="end">−</text>
  <text class="pota" x="318" y="147">G</text>
  <text class="pota" x="338" y="147">B</text>
  <text class="lbl" x="356" y="110">LED RGB (4 potes)</text>
  <text class="lbl2" x="356" y="128">la pota més llarga és el càtode comú (−)</text>

  <!-- pont càtode comú → carril de massa -->
  <polyline class="wN" points="290,88 290,70"/>

  <!-- resistències: cada canal salta el canal central -->
  <polyline class="res" points="270,152 270,160 264,166 276,172 264,178 276,184 264,190 270,194 270,200"/>
  <polyline class="res" points="310,152 310,160 304,166 316,172 304,178 316,184 304,190 310,194 310,200"/>
  <polyline class="res" points="330,152 330,160 324,166 336,172 324,178 336,184 324,190 330,194 330,200"/>
  <text class="lbl2" x="230" y="180" text-anchor="end">3 × 220 Ω</text>

  <!-- cables de senyal cap als pins PWM -->
  <polyline class="wV" points="270,232 270,300 358,336"/>
  <polyline class="wVd" points="310,232 315,300 483,336"/>
  <polyline class="wB" points="330,232 345,300 608,336"/>

  <!-- ========= retorn de massa: carril → GND ========= -->
  <polyline class="wN" points="70,56 70,290 108,336"/>

  <!-- ================== ARDUINO UNO ================== -->
  <rect class="board" x="70" y="330" width="620" height="180" rx="12"/>
  <rect class="pad" x="86" y="336" width="44" height="26" rx="5"/><text class="padtxt" x="108" y="354" text-anchor="middle">GND</text>
  <rect class="pad" x="339" y="336" width="38" height="26" rx="5"/><text class="padtxt" x="358" y="354" text-anchor="middle">~9</text>
  <rect class="pad" x="464" y="336" width="38" height="26" rx="5"/><text class="padtxt" x="483" y="354" text-anchor="middle">~10</text>
  <rect class="pad" x="589" y="336" width="38" height="26" rx="5"/><text class="padtxt" x="608" y="354" text-anchor="middle">~11</text>
  <text class="btxt" x="380" y="450" text-anchor="middle">ARDUINO UNO</text>
  <text class="lbl2" x="358" y="382" fill="#e0f2fe" text-anchor="middle">R</text>
  <text class="lbl2" x="483" y="382" fill="#e0f2fe" text-anchor="middle">G</text>
  <text class="lbl2" x="608" y="382" fill="#e0f2fe" text-anchor="middle">B</text>

  <!-- ================== LLEGENDA ================== -->
  <text class="lbl2" x="70" y="530">Ordre habitual de potes: R · càtode (la llarga) · G · B — comprova-ho al datasheet o provant-ho amb 3,3 V i una 220 Ω.</text>
  <text class="lbl2" x="70" y="548">Cada color porta la SEVA resistència: si compartissin una de sola, els colors es robarien corrent entre ells.</text>
</svg>
