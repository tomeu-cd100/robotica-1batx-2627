<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d">
  <title id="t">Connexions del mòdul relé</title>
  <desc id="d">A l'esquerra, l'Arduino: el pin 7 va a S o IN del mòdul relé, 5 V a + o VCC i GND a − o GND. Aquest és el costat de control. A la dreta, els borns de cargol del relé: COM va a 5 V, NO va a una resistència de 220 ohms i a un LED que torna a GND. NC queda lliure. Quan el pin 7 es posa a HIGH, el relé fa clic, uneix COM amb NO i el LED s'encén.</desc>
  <style>
    .fr{fill:#f6faf9;stroke:#d7e6e5;stroke-width:1.5}
    .box{fill:#ffffff;stroke:#0e1b1c;stroke-width:2}
    .mod{fill:#e8f1fb;stroke:#1d4ed8;stroke-width:2}
    .w{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .sig{stroke:#ea580c}.v5{stroke:#dc2626}.gnd{stroke:#0e1b1c}.ld{stroke:#7c3aed}
    .lbl{font:700 14px system-ui,'Segoe UI',sans-serif;fill:#0e1b1c}
    .mut{font:600 12.5px system-ui,'Segoe UI',sans-serif;fill:#4f6d6e}
    .pin{font:700 13px 'Consolas',monospace;fill:#0e1b1c}
    .tit{font:800 13px system-ui,sans-serif;fill:#0c6e70;letter-spacing:.04em}
  </style>
  <rect class="fr" x="1" y="1" width="758" height="398" rx="14"/>

  <text class="tit" x="150" y="34" text-anchor="middle">COSTAT DE CONTROL</text>
  <text class="tit" x="600" y="34" text-anchor="middle">COSTAT DE CÀRREGA</text>

  <!-- Arduino -->
  <rect class="box" x="24" y="70" width="120" height="200" rx="10"/>
  <text class="lbl" x="84" y="96" text-anchor="middle">Arduino</text>
  <text class="pin" x="134" y="125" text-anchor="end">7</text>
  <text class="pin" x="134" y="185" text-anchor="end">5V</text>
  <text class="pin" x="134" y="245" text-anchor="end">GND</text>

  <!-- cables de control -->
  <line class="w sig" x1="144" y1="120" x2="270" y2="120"/>
  <line class="w v5"  x1="144" y1="180" x2="270" y2="180"/>
  <line class="w gnd" x1="144" y1="240" x2="270" y2="240"/>

  <!-- mòdul relé -->
  <rect class="mod" x="270" y="70" width="210" height="200" rx="10"/>
  <text class="lbl" x="375" y="96" text-anchor="middle">Mòdul relé</text>
  <text class="pin" x="280" y="125">S / IN</text>
  <text class="pin" x="280" y="185">+ / VCC</text>
  <text class="pin" x="280" y="245">− / GND</text>
  <text class="pin" x="470" y="125" text-anchor="end">NO</text>
  <text class="pin" x="470" y="185" text-anchor="end">COM</text>
  <text class="pin" x="470" y="245" text-anchor="end">NC</text>
  <!-- interruptor intern: COM en repòs toca NC -->
  <circle cx="440" cy="180" r="4" fill="#0e1b1c"/>
  <circle cx="440" cy="120" r="3.5" fill="#0e1b1c"/>
  <circle cx="440" cy="240" r="3.5" fill="#0e1b1c"/>
  <line x1="440" y1="180" x2="428" y2="236" stroke="#0e1b1c" stroke-width="2.4"/>
  <path d="M424,170 Q412,150 432,128" fill="none" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="4 3"/>
  <path d="M432,128 l-9,2 l5,6z" fill="#1d4ed8"/>
  <text class="mut" x="375" y="150" text-anchor="middle">«clic»</text>

  <!-- borns de cargol -->
  <rect x="480" y="108" width="16" height="24" rx="3" fill="#2563eb"/>
  <rect x="480" y="168" width="16" height="24" rx="3" fill="#2563eb"/>
  <rect x="480" y="228" width="16" height="24" rx="3" fill="#2563eb"/>
  <text class="mut" x="488" y="270" text-anchor="middle">(lliure)</text>

  <!-- COM -> 5 V -->
  <polyline class="w v5" points="496,180 540,180 540,330"/>
  <text class="lbl" x="540" y="352" text-anchor="middle">5 V</text>
  <text class="mut" x="540" y="370" text-anchor="middle">(fila + vermella)</text>

  <!-- NO -> 220 -> LED -> GND -->
  <polyline class="w ld" points="496,120 650,120 650,140"/>
  <polyline class="w ld" points="650,140 650,146 640,150 660,158 640,166 660,174 650,178 650,186"/>
  <text class="lbl" x="668" y="168">220 Ω</text>
  <line class="w ld" x1="650" y1="186" x2="650" y2="214"/>
  <path d="M636,214 h28 l-14,22 z" fill="#facc15" stroke="#0e1b1c" stroke-width="2"/>
  <line x1="636" y1="236" x2="664" y2="236" stroke="#0e1b1c" stroke-width="2.4"/>
  <text class="lbl" x="674" y="232">LED</text>
  <line class="w gnd" x1="650" y1="236" x2="650" y2="318"/>
  <line class="w gnd" x1="630" y1="318" x2="670" y2="318"/>
  <line class="w gnd" x1="637" y1="328" x2="663" y2="328"/>
  <line class="w gnd" x1="644" y1="338" x2="656" y2="338"/>
  <text class="lbl" x="650" y="362" text-anchor="middle">GND</text>

  <text class="mut" x="24" y="310">pin 7 a HIGH → el relé fa «clic»,</text>
  <text class="mut" x="24" y="330">uneix COM amb NO i el LED s'encén.</text>
  <text class="mut" x="24" y="356">pin 7 a LOW → COM torna a NC: LED apagat.</text>
</svg>
