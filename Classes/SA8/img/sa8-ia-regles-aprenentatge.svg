<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="t d">
  <title id="t">De les regles a l'aprenentatge automàtic</title>
  <desc id="d">Dues maneres de classificar un gest. Amb regles, una persona escriu condicions (si l'acceleració supera un llindar, és un gest) i el programa decideix. Amb aprenentatge automàtic, es donen molts exemples etiquetats, un model n'aprèn els patrons i després classifica gestos nous.</desc>
  <style>
    .fr{fill:#f6faf9;stroke:#d7e6e5;stroke-width:1.5}
    .box{fill:#ffffff;stroke:#b7d0cf;stroke-width:1.6}
    .boxa{fill:#e3f1f0;stroke:#0891b2;stroke-width:1.8}
    .boxb{fill:#f3e8ff;stroke:#7c3aed;stroke-width:1.8}
    .h{font:700 14px system-ui,'Segoe UI',sans-serif;fill:#0e1b1c}
    .t{font:600 12.5px system-ui,'Segoe UI',sans-serif;fill:#0e1b1c}
    .mut{font:600 11.5px system-ui,'Segoe UI',sans-serif;fill:#4f6d6e}
    .wire{fill:none;stroke:#4f6d6e;stroke-width:2}
  </style>
  <defs><marker id="m" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#4f6d6e"/></marker></defs>
  <rect class="fr" x="1" y="1" width="758" height="318" rx="14"/>

  <!-- Columna A: regles -->
  <text class="h" x="200" y="42" text-anchor="middle">A · Basada en regles</text>
  <rect class="boxa" x="60" y="70" width="120" height="50" rx="8"/>
  <text class="t" x="120" y="92" text-anchor="middle">Persona</text>
  <text class="mut" x="120" y="108" text-anchor="middle">escriu les regles</text>
  <path class="wire" d="M120,120 V150" marker-end="url(#m)"/>
  <rect class="box" x="50" y="152" width="140" height="56" rx="8"/>
  <text class="mut" x="120" y="176" text-anchor="middle">si acceleració &gt; llindar</text>
  <text class="mut" x="120" y="194" text-anchor="middle">→ gest detectat (if/else)</text>
  <path class="wire" d="M120,208 V238" marker-end="url(#m)"/>
  <rect class="boxa" x="60" y="240" width="120" height="46" rx="8"/>
  <text class="t" x="120" y="268" text-anchor="middle">Classifica</text>

  <!-- separador -->
  <line x1="380" y1="60" x2="380" y2="290" stroke="#d7e6e5" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- Columna B: aprenentatge -->
  <text class="h" x="560" y="42" text-anchor="middle">B · Aprenentatge automàtic</text>
  <rect class="boxb" x="500" y="70" width="120" height="50" rx="8"/>
  <text class="t" x="560" y="92" text-anchor="middle">Exemples</text>
  <text class="mut" x="560" y="108" text-anchor="middle">molts, etiquetats</text>
  <path class="wire" d="M560,120 V150" marker-end="url(#m)"/>
  <rect class="box" x="490" y="152" width="140" height="56" rx="8"/>
  <text class="mut" x="560" y="176" text-anchor="middle">un model</text>
  <text class="mut" x="560" y="194" text-anchor="middle">n'aprèn els patrons</text>
  <path class="wire" d="M560,208 V238" marker-end="url(#m)"/>
  <rect class="boxb" x="500" y="240" width="120" height="46" rx="8"/>
  <text class="t" x="560" y="268" text-anchor="middle">Classifica</text>

  <text class="mut" x="380" y="308" text-anchor="middle">Amb regles ho decideix una persona; amb aprenentatge, el model ho dedueix dels exemples.</text>
</svg>
