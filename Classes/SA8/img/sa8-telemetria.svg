<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-labelledby="t d">
  <title id="t">Telemetria amb dues micro:bit</title>
  <desc id="d">Una micro:bit emissora mesura temperatura o llum i ho envia per ràdio a una micro:bit receptora, que ho mostra i ho imprimeix pel port sèrie via USB a un ordinador, on es pot registrar i fer-ne un gràfic.</desc>
  <style>
    .fr{fill:#f6faf9;stroke:#d7e6e5;stroke-width:1.5}
    .board{fill:#111827;stroke:#000;stroke-width:2}
    .led{fill:#ef4444}
    .pc{fill:#eaf3f2;stroke:#0891b2;stroke-width:2}
    .cap{font:700 13px system-ui,'Segoe UI',sans-serif;fill:#0e1b1c}
    .mut{font:600 12px system-ui,'Segoe UI',sans-serif;fill:#4f6d6e}
    .code{font:700 12px 'Consolas',monospace;fill:#0c6e70}
  </style>
  <rect class="fr" x="1" y="1" width="758" height="248" rx="14"/>

  <!-- Emissor -->
  <rect class="board" x="40" y="70" width="120" height="90" rx="10"/>
  <g class="led"><rect x="76" y="96" width="10" height="10"/><rect x="95" y="96" width="10" height="10"/><rect x="114" y="96" width="10" height="10"/><rect x="76" y="115" width="10" height="10"/><rect x="95" y="115" width="10" height="10"/><rect x="114" y="115" width="10" height="10"/></g>
  <text class="cap" x="100" y="182" text-anchor="middle">Emissor</text>
  <text class="mut" x="100" y="200" text-anchor="middle">mesura T / llum</text>

  <!-- Radio -->
  <g fill="none" stroke="#0891b2" stroke-width="2.4">
    <path d="M180,100 q18,20 0,40"/>
    <path d="M196,92 q26,28 0,56"/>
  </g>
  <text class="code" x="250" y="96" text-anchor="middle">ràdio</text>
  <text class="mut" x="250" y="150" text-anchor="middle">(mateix group)</text>

  <!-- Receptor -->
  <rect class="board" x="320" y="70" width="120" height="90" rx="10"/>
  <g class="led"><rect x="356" y="96" width="10" height="10"/><rect x="375" y="96" width="10" height="10"/><rect x="394" y="96" width="10" height="10"/><rect x="356" y="115" width="10" height="10"/><rect x="375" y="115" width="10" height="10"/><rect x="394" y="115" width="10" height="10"/></g>
  <text class="cap" x="380" y="182" text-anchor="middle">Receptor</text>
  <text class="mut" x="380" y="200" text-anchor="middle">mostra i imprimeix</text>

  <!-- USB -->
  <line x1="440" y1="115" x2="560" y2="115" stroke="#0e1b1c" stroke-width="2.4"/>
  <text class="code" x="500" y="106" text-anchor="middle">USB</text>

  <!-- PC -->
  <rect class="pc" x="560" y="72" width="150" height="86" rx="8"/>
  <rect x="576" y="86" width="118" height="58" rx="3" fill="#ffffff" stroke="#b7d0cf"/>
  <polyline points="586,132 610,114 634,122 660,98 684,104" fill="none" stroke="#0891b2" stroke-width="2"/>
  <text class="cap" x="635" y="182" text-anchor="middle">PC · registre</text>
  <text class="mut" x="635" y="200" text-anchor="middle">full de càlcul + gràfic</text>
</svg>
