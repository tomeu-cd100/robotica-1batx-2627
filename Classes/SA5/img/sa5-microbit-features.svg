<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440" role="img" aria-labelledby="t d">
  <title id="t">La placa micro:bit i les seves parts</title>
  <desc id="d">La micro:bit té una matriu de 25 LED, dos botons A i B, sensors integrats (acceleròmetre, brúixola, llum, temperatura), connexió ràdio, i un connector de vora amb els pins P0, P1, P2, 3V i GND, més USB i botó de reset.</desc>
  <style>
    .fr{fill:#f6faf9;stroke:#d7e6e5;stroke-width:1.5}
    .board{fill:#111827;stroke:#000;stroke-width:2}
    .led{fill:#ef4444}
    .btn{fill:#374151;stroke:#e5e7eb;stroke-width:1.5}
    .btntxt{font:700 15px system-ui,sans-serif;fill:#e5e7eb}
    .gold{fill:#d4af37;stroke:#a67c00;stroke-width:1}
    .goldtxt{font:700 12px 'Consolas',monospace;fill:#111827}
    .callbox{fill:#ffffff;stroke:#b7d0cf;stroke-width:1.2}
    .call{font:600 12.5px system-ui,'Segoe UI',sans-serif;fill:#0e1b1c}
    .lead{stroke:#4f6d6e;stroke-width:1.3;fill:none}
    .dot{fill:#4f6d6e}
  </style>
  <rect class="fr" x="1" y="1" width="778" height="438" rx="14"/>

  <!-- Placa -->
  <rect class="board" x="250" y="70" width="280" height="220" rx="14"/>

  <!-- Matriu 5x5 -->
  <g class="led">
    <!-- files y=120..232 pas 28 ; cols x=320..432 pas 28 -->
    <g>
      <rect x="316" y="116" width="14" height="14" rx="3"/><rect x="344" y="116" width="14" height="14" rx="3"/><rect x="372" y="116" width="14" height="14" rx="3"/><rect x="400" y="116" width="14" height="14" rx="3"/><rect x="428" y="116" width="14" height="14" rx="3"/>
      <rect x="316" y="144" width="14" height="14" rx="3"/><rect x="344" y="144" width="14" height="14" rx="3"/><rect x="372" y="144" width="14" height="14" rx="3"/><rect x="400" y="144" width="14" height="14" rx="3"/><rect x="428" y="144" width="14" height="14" rx="3"/>
      <rect x="316" y="172" width="14" height="14" rx="3"/><rect x="344" y="172" width="14" height="14" rx="3"/><rect x="372" y="172" width="14" height="14" rx="3"/><rect x="400" y="172" width="14" height="14" rx="3"/><rect x="428" y="172" width="14" height="14" rx="3"/>
      <rect x="316" y="200" width="14" height="14" rx="3"/><rect x="344" y="200" width="14" height="14" rx="3"/><rect x="372" y="200" width="14" height="14" rx="3"/><rect x="400" y="200" width="14" height="14" rx="3"/><rect x="428" y="200" width="14" height="14" rx="3"/>
      <rect x="316" y="228" width="14" height="14" rx="3"/><rect x="344" y="228" width="14" height="14" rx="3"/><rect x="372" y="228" width="14" height="14" rx="3"/><rect x="400" y="228" width="14" height="14" rx="3"/><rect x="428" y="228" width="14" height="14" rx="3"/>
    </g>
  </g>

  <!-- Botons A i B -->
  <rect class="btn" x="262" y="150" width="34" height="34" rx="5"/><text class="btntxt" x="279" y="173" text-anchor="middle">A</text>
  <rect class="btn" x="484" y="150" width="34" height="34" rx="5"/><text class="btntxt" x="501" y="173" text-anchor="middle">B</text>

  <!-- Connector de vora (pins grans) -->
  <g>
    <rect class="gold" x="266" y="256" width="30" height="34" rx="2"/><text class="goldtxt" x="281" y="278" text-anchor="middle">P0</text>
    <rect class="gold" x="316" y="256" width="30" height="34" rx="2"/><text class="goldtxt" x="331" y="278" text-anchor="middle">P1</text>
    <rect class="gold" x="366" y="256" width="30" height="34" rx="2"/><text class="goldtxt" x="381" y="278" text-anchor="middle">P2</text>
    <rect class="gold" x="430" y="256" width="30" height="34" rx="2"/><text class="goldtxt" x="445" y="278" text-anchor="middle">3V</text>
    <rect class="gold" x="484" y="256" width="34" height="34" rx="2"/><text class="goldtxt" x="501" y="278" text-anchor="middle">GND</text>
  </g>

  <!-- USB + reset (a dalt) -->
  <rect x="360" y="60" width="60" height="16" rx="3" fill="#9ca3af"/>
  <circle cx="470" cy="80" r="6" fill="#6b7280"/>

  <!-- Callouts -->
  <rect class="callbox" x="300" y="20" width="180" height="30" rx="7"/>
  <text class="call" x="390" y="40" text-anchor="middle">USB + botó de reset</text>
  <path class="lead" d="M390,50 V60"/><circle class="dot" cx="390" cy="60" r="2.5"/>

  <rect class="callbox" x="560" y="96" width="196" height="30" rx="7"/>
  <text class="call" x="658" y="116" text-anchor="middle">Matriu de 25 LED (display)</text>
  <path class="lead" d="M560,111 H448"/><circle class="dot" cx="448" cy="150" r="2.5"/>

  <rect class="callbox" x="560" y="150" width="196" height="30" rx="7"/>
  <text class="call" x="658" y="170" text-anchor="middle">Botons A i B</text>
  <path class="lead" d="M560,165 H518"/><circle class="dot" cx="518" cy="167" r="2.5"/>

  <rect class="callbox" x="560" y="206" width="200" height="46" rx="7"/>
  <text class="call" x="660" y="224" text-anchor="middle">Sensors integrats:</text>
  <text class="call" x="660" y="242" text-anchor="middle">acceleròmetre, llum, Tª, ràdio</text>
  <path class="lead" d="M560,228 H470 V214"/><circle class="dot" cx="470" cy="214" r="2.5"/>

  <rect class="callbox" x="30" y="256" width="180" height="46" rx="7"/>
  <text class="call" x="120" y="274" text-anchor="middle">Pins P0–P2 (E/S)</text>
  <text class="call" x="120" y="292" text-anchor="middle">+ 3V i GND (alimentació)</text>
  <path class="lead" d="M210,278 H250"/><circle class="dot" cx="250" cy="278" r="2.5"/>

  <text class="call" x="390" y="330" text-anchor="middle" style="font:600 12.5px system-ui,sans-serif;fill:#4f6d6e">Es programa amb MicroPython via USB · molts sensors sense muntar res</text>
</svg>
