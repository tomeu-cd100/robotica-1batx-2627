<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="t d">
  <title id="t">Comunicació per ràdio entre dues micro:bit</title>
  <desc id="d">Dues micro:bit amb el mateix grup de ràdio (per exemple group=10) es poden enviar i rebre missatges. Cada placa pot fer les dues coses.</desc>
  <style>
    .fr{fill:#f6faf9;stroke:#d7e6e5;stroke-width:1.5}
    .board{fill:#111827;stroke:#000;stroke-width:2}
    .led{fill:#ef4444}
    .lbl{font:700 13px system-ui,'Segoe UI',sans-serif;fill:#0e1b1c}
    .mut{font:600 12.5px system-ui,'Segoe UI',sans-serif;fill:#4f6d6e}
    .code{font:700 13px 'Consolas',monospace;fill:#0c6e70}
  </style>
  <rect class="fr" x="1" y="1" width="638" height="258" rx="14"/>

  <!-- micro:bit A -->
  <g>
    <rect class="board" x="60" y="70" width="130" height="100" rx="10"/>
    <g class="led">
      <rect x="98" y="98" width="10" height="10"/><rect x="118" y="98" width="10" height="10"/><rect x="138" y="98" width="10" height="10"/>
      <rect x="98" y="118" width="10" height="10"/><rect x="118" y="118" width="10" height="10"/><rect x="138" y="118" width="10" height="10"/>
      <rect x="98" y="138" width="10" height="10"/><rect x="118" y="138" width="10" height="10"/><rect x="138" y="138" width="10" height="10"/>
    </g>
    <text class="lbl" x="125" y="192" text-anchor="middle">micro:bit 1</text>
  </g>

  <!-- micro:bit B -->
  <g>
    <rect class="board" x="450" y="70" width="130" height="100" rx="10"/>
    <g class="led">
      <rect x="488" y="98" width="10" height="10"/><rect x="508" y="98" width="10" height="10"/><rect x="528" y="98" width="10" height="10"/>
      <rect x="488" y="118" width="10" height="10"/><rect x="508" y="118" width="10" height="10"/><rect x="528" y="118" width="10" height="10"/>
      <rect x="488" y="138" width="10" height="10"/><rect x="508" y="138" width="10" height="10"/><rect x="528" y="138" width="10" height="10"/>
    </g>
    <text class="lbl" x="515" y="192" text-anchor="middle">micro:bit 2</text>
  </g>

  <!-- ones de ràdio bidireccionals -->
  <g fill="none" stroke="#0891b2" stroke-width="2.4">
    <path d="M210,100 q18,20 0,40"/>
    <path d="M226,92 q26,28 0,56"/>
    <path d="M430,100 q-18,20 0,40"/>
    <path d="M414,92 q-26,28 0,56"/>
  </g>
  <text class="code" x="320" y="96" text-anchor="middle">radio · group = 10</text>
  <text class="mut" x="320" y="130" text-anchor="middle">envien i reben</text>
  <text class="mut" x="320" y="150" text-anchor="middle">(mateix grup)</text>
</svg>
