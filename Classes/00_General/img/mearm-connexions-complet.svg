  <circle cx="200" cy="600" r="3.5" fill="#0c6e70"/>
  <text class="pin" x="192" y="624" text-anchor="end">A3</text>
  <circle cx="200" cy="620" r="3.5" fill="#0c6e70"/>
  <polyline class="w v5" points="200,430 770,430"/>
  <polyline class="w gnd" points="200,450 770,450"/>
