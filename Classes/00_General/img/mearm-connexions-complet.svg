<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" role="img" aria-labelledby="t d">
  <title id="t">Esquema complet del braç MeArm al 2n trimestre</title>
  <desc id="d">Arduino UNO amb tot el que s'hi connecta al llarg del trimestre. A la dreta: piles per als quatre servos (esquerre D6, base D9, dret D10, pinça D11) amb GND comú, i quatre potenciòmetres a A0-A3. A l'esquerra: la micro:bit pont (P1 a D0), el sensor de col·lisió a D2, els polsadors A i B a D3 i D4, i l'ultrasons amb TRIG a D7 i ECHO a D8.</desc>
  <style>
    .fr{fill:#f6faf9;stroke:#d7e6e5;stroke-width:1.5}
    .placa{fill:#e0f2f1;stroke:#0c6e70;stroke-width:2.5}
    .mb{fill:#1e293b;stroke:#0f172a;stroke-width:2}
    .servo{fill:#dbeafe;stroke:#1d4ed8;stroke-width:2}
    .pot{fill:#fef3c7;stroke:#b45309;stroke-width:2}
    .pila{fill:#fee2e2;stroke:#b91c1c;stroke-width:2}
    .w{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .sig{stroke:#f59e0b}.pos{stroke:#dc2626}.neg{stroke:#78350f}
    .v5{stroke:#be123c}.gnd{stroke:#334155}.an{stroke:#0891b2}
    .ona{fill:none;stroke:#0891b2;stroke-width:2.5;stroke-linecap:round}
    .tit{font:700 16px system-ui,'Segoe UI',sans-serif;fill:#0e1b1c}
    .lbl{font:600 13px system-ui,'Segoe UI',sans-serif;fill:#0e1b1c}
    .lbl2{font:400 12px system-ui,'Segoe UI',sans-serif;fill:#475569}
    .pin{font:700 12px 'Consolas',monospace;fill:#0c6e70}
    .pinb{font:700 12px 'Consolas',monospace;fill:#ffffff}
    .avis{font:600 12px system-ui,'Segoe UI',sans-serif;fill:#b91c1c}
    .dig{stroke:#7c3aed}
    .sens{fill:#ede9fe;stroke:#6d28d9;stroke-width:2}
  </style>
  <rect class="fr" x="1" y="1" width="998" height="678" rx="14"/>
  <text class="tit" x="24" y="34">El braç MeArm · mapa de pins de tot el trimestre</text>
  <line class="w sig" x1="560" y1="30" x2="582" y2="30"/>
  <text class="lbl2" x="588" y="34">senyal</text>
  <line class="w pos" x1="655" y1="30" x2="677" y2="30"/>
  <text class="lbl2" x="683" y="34">+ servos</text>
  <line class="w neg" x1="750" y1="30" x2="772" y2="30"/>
  <text class="lbl2" x="778" y="34">− / GND</text>
  <line class="w dig" x1="845" y1="30" x2="867" y2="30"/>
  <text class="lbl2" x="873" y="34">sensors</text>
  <g transform="translate(200,0)">
