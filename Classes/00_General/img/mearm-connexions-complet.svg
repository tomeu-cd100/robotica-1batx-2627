  <line x1="360" y1="510" x2="367" y2="502" stroke="#b45309" stroke-width="2.5"/>
  <polyline class="w an" points="360,530 360,560 200,560"/>
  <text class="lbl2" x="368" y="548">base</text>
  <polyline class="w v5" points="458,490 458,430"/>
  <circle cx="458" cy="430" r="4.5" fill="#0e1b1c"/>
