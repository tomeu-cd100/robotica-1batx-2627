<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 450" width="660" height="450" role="img" aria-labelledby="t d">
  <title id="t">Cara de la mascota reactiva</title>
  <desc id="d">Caixa de DM amb dues orelles encaixades a la tapa (una de rodona i una de gat), celles i galtes gravades, dos ulls NeoPixel amb difusor, el sensor PIR com a nas, una boca somrient tallada al làser que fa de sortida de so del brunzidor i de finestra per al micròfon i el TEMT6000, i el polsador al llom.</desc>
  <style>
    .fr{fill:#f6faf9;stroke:#d7e6e5;stroke-width:1.5}
    .fusta{fill:#ecd9b8;stroke:#7c5a33;stroke-width:2.5}
    .tapa{fill:#dfc79e;stroke:#7c5a33;stroke-width:2}
    .grav{fill:none;stroke:#7c5a33;stroke-width:2.5;stroke-linecap:round}
    .tall{fill:none;stroke:#0e1b1c;stroke-width:9;stroke-linecap:round}
    .guia{fill:none;stroke:#64748b;stroke-width:1.3}
    .lbl{font:600 13px system-ui,'Segoe UI',sans-serif;fill:#0e1b1c}
    .lbl2{font:400 12px system-ui,'Segoe UI',sans-serif;fill:#475569}
    .padtxt{font:700 11px 'Consolas',monospace;fill:#0c6e70}
  </style>
  <rect class="fr" x="1" y="1" width="658" height="448" rx="14"/>

  <!-- Orelles (encaixades a les ranures de la tapa) -->
  <circle class="fusta" cx="256" cy="92" r="30"/>
  <rect class="fusta" x="246" y="116" width="20" height="14"/>
  <polygon class="fusta" points="382,124 409,48 436,124"/>

  <!-- Caixa frontal + tapa amb ranures -->
  <rect class="fusta" x="185" y="125" width="300" height="240" rx="6"/>
  <rect class="tapa" x="185" y="125" width="300" height="16"/>
  <rect x="245" y="129" width="22" height="8" fill="#7c5a33"/>
  <rect x="398" y="129" width="22" height="8" fill="#7c5a33"/>

  <!-- Celles (gravat) -->
  <path class="grav" d="M230,172 q12,-12 25,0 q12,12 25,0"/>
  <path class="grav" d="M390,172 q12,-12 25,0 q12,12 25,0"/>

  <!-- Ulls: NeoPixel + difusor imprès en 3D -->
  <circle cx="255" cy="215" r="24" fill="#f0fdfa" stroke="#0891b2" stroke-width="3"/>
  <circle cx="255" cy="215" r="11" fill="#06b6d4"/>
  <circle cx="251" cy="210" r="3.5" fill="#e0f7fa"/>
  <circle cx="415" cy="215" r="24" fill="#f0fdfa" stroke="#0891b2" stroke-width="3"/>
  <circle cx="415" cy="215" r="11" fill="#06b6d4"/>
  <circle cx="411" cy="210" r="3.5" fill="#e0f7fa"/>

  <!-- Nas: sensor PIR mirant cap enfora -->
  <circle cx="335" cy="238" r="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <path class="guia" d="M320,231 h30 M320,238 h30 M322,245 h26"/>
  <text class="padtxt" x="335" y="270" text-anchor="middle">PIR</text>

  <!-- Galtes (gravat) -->
  <circle class="grav" cx="222" cy="258" r="13" stroke-dasharray="4 4"/>
  <circle class="grav" cx="448" cy="258" r="13" stroke-dasharray="4 4"/>

  <!-- Boca somrient (TALLADA al làser) -->
  <path class="tall" d="M260,295 Q335,350 410,295"/>

  <!-- Polsador al llom -->
  <rect x="483" y="185" width="16" height="28" rx="5" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>

  <!-- Etiquetes amb línies guia -->
  <text class="lbl" x="18" y="150">celles i galtes · gravat</text>
  <line class="guia" x1="152" y1="146" x2="226" y2="168"/>

  <text class="lbl" x="18" y="225">ulls · NeoPixel + difusor 3D</text>
  <line class="guia" x1="190" y1="221" x2="229" y2="216"/>

  <text class="lbl" x="642" y="70" text-anchor="end">orelles · encaixen a la tapa</text>
  <line class="guia" x1="462" y1="66" x2="430" y2="80"/>

  <text class="lbl" x="642" y="162" text-anchor="end">polsador al llom (carícia)</text>
  <line class="guia" x1="520" y1="167" x2="495" y2="184"/>

  <!-- Llegenda tall/gravat -->
  <line x1="18" y1="398" x2="52" y2="398" stroke="#0e1b1c" stroke-width="6" stroke-linecap="round"/>
  <text class="lbl2" x="60" y="402">tall làser</text>
  <path class="grav" d="M18,420 q8,-8 17,0 q8,8 17,0"/>
  <text class="lbl2" x="60" y="424">gravat</text>

  <!-- Peu: la boca tallada -->
  <line class="guia" x1="335" y1="332" x2="370" y2="384"/>
  <text class="lbl" x="370" y="400" text-anchor="middle">boca somrient TALLADA · surt el so del brunzidor</text>
  <text class="lbl2" x="370" y="418" text-anchor="middle">i entren la llum i el so cap al TEMT6000 i el micròfon (muntats darrere)</text>
</svg>
