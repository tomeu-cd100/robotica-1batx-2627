<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 300" role="img"
     aria-label="Croquis de la llum d'estat EstaLlum: cub amb una cara difusora que mostra tres estats de color (verd lliure, groc un moment, vermell no molestar) i un botó d'estat al lateral.">
  <style>
    .bg{fill:#ffffff;stroke:#cbd8d7;stroke-width:2}
    .box{fill:#f4f8f8;stroke:#26484a;stroke-width:2.5}
    .edge{fill:#e5eeee;stroke:#26484a;stroke-width:2.5}
    .lbl{font:600 13px "Segoe UI",Arial,sans-serif;fill:#26484a}
    .tag{font:700 12px "Segoe UI",Arial,sans-serif;fill:#0c6e70}
    .lead{stroke:#7d9a9a;stroke-width:1.5;fill:none}
  </style>
  <rect class="bg" x="1" y="1" width="488" height="298" rx="14"/>
  <!-- cub amb perspectiva senzilla -->
  <polygon class="edge" points="120,70 250,70 285,45 155,45"/>
  <polygon class="edge" points="250,70 250,210 285,185 285,45"/>
  <rect class="box" x="120" y="70" width="130" height="140" rx="6"/>
  <!-- cara difusora amb els 3 estats -->
  <rect x="134" y="86" width="102" height="80" rx="6" fill="#fbfdfd" stroke="#9fbcbb" stroke-width="1.5"/>
  <circle cx="160" cy="126" r="15" fill="#1f8a3b"/>
  <circle cx="185" cy="126" r="15" fill="#d69e00"/>
  <circle cx="210" cy="126" r="15" fill="#c0392b"/>
  <text x="185" y="182" text-anchor="middle" class="lbl">cara difusora</text>
  <!-- botó d'estat -->
  <circle cx="150" cy="196" r="9" fill="#ffffff" stroke="#26484a" stroke-width="2.5"/>
  <circle cx="150" cy="196" r="3.5" fill="#0c6e70"/>
  <!-- etiquetes -->
  <path class="lead" d="M236 126 H300"/>
  <text x="305" y="115" class="tag">verd = lliure</text>
  <text x="305" y="131" class="tag">groc = un moment</text>
  <text x="305" y="147" class="tag">vermell = no molestar</text>
  <path class="lead" d="M150 205 V235 H235"/>
  <text x="240" y="239" class="lbl">botó d'estat</text>
</svg>
