<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="800" height="680" role="img" aria-labelledby="t d">
  <title id="t">Esquema de connexions del braç MeArm · versió Arduino</title>
  <desc id="d">Arduino UNO amb quatre servos i quatre potenciòmetres. Les piles (4 AA, 6 V) alimenten els servos per dues línies, + i GND; el GND de les piles va també al GND de l'Arduino. Senyals dels servos: esquerre a D6, base a D9, dret a D10 i pinça a D11. Potenciòmetres alimentats pel 5V de l'Arduino, amb el cursor a A0 (base), A1 (dret), A2 (pinça) i A3 (esquerre).</desc>
  <style>
    .fr{fill:#f6faf9;stroke:#d7e6e5;stroke-width:1.5}
    .placa{fill:#e0f2f1;stroke:#0c6e70;stroke-width:2.5}
    .mb{fill:#1e293b;stroke:#0f172a;stroke-width:2}
    .servo{fill:#dbeafe;stroke:#1d4ed8;stroke-width:2}
    .pot{fill:#fef3c7;stroke:#b45309;stroke-width:2}
    .pila{fill:#fee2e2;stroke:#b91c1c;stroke-width:2}
    .w{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .sig{stroke:#f59e0b}.pos{stroke:#dc2626}.neg{stroke:#78350f}
    .v5{stroke:#be123c}.gnd{stroke:#334155}.an{stroke:#0891b2}
    .ona{fill:none;stroke:#0891b2;stroke-width:2.5;stroke-linecap:round}
    .tit{font:700 16px system-ui,'Segoe UI',sans-serif;fill:#0e1b1c}
    .lbl{font:600 13px system-ui,'Segoe UI',sans-serif;fill:#0e1b1c}
    .lbl2{font:400 12px system-ui,'Segoe UI',sans-serif;fill:#475569}
    .pin{font:700 12px 'Consolas',monospace;fill:#0c6e70}
    .pinb{font:700 12px 'Consolas',monospace;fill:#ffffff}
    .avis{font:600 12px system-ui,'Segoe UI',sans-serif;fill:#b91c1c}
  </style>
  <rect class="fr" x="1" y="1" width="798" height="678" rx="14"/>
  <text class="tit" x="24" y="34">Versió Arduino · 4 servos + 4 potenciòmetres</text>
  <line class="w sig" x1="490" y1="30" x2="512" y2="30"/>
  <text class="lbl2" x="518" y="34">senyal</text>
  <line class="w pos" x1="585" y1="30" x2="607" y2="30"/>
  <text class="lbl2" x="613" y="34">+ servos</text>
  <line class="w neg" x1="680" y1="30" x2="702" y2="30"/>
  <text class="lbl2" x="708" y="34">− / GND</text>
  <rect class="servo" x="300" y="60" width="110" height="58" rx="8"/>
  <text class="lbl" x="355" y="85" text-anchor="middle">ESQUERRE</text>
