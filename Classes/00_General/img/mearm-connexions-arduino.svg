  <polyline class="w gnd" points="502,490 502,450"/>
  <circle cx="502" cy="450" r="4.5" fill="#0e1b1c"/>
  <rect class="pot" x="440" y="490" width="80" height="40" rx="8"/>
  <circle cx="480" cy="510" r="11" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <line x1="480" y1="510" x2="487" y2="502" stroke="#b45309" stroke-width="2.5"/>
  <polyline class="w an" points="480,530 480,580 200,580"/>
