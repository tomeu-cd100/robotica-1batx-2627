  <circle cx="720" cy="510" r="11" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <line x1="720" y1="510" x2="727" y2="502" stroke="#b45309" stroke-width="2.5"/>
  <polyline class="w an" points="720,530 720,620 200,620"/>
  <text class="lbl2" x="728" y="548">esquerre</text>
  <text class="avis" x="24" y="664">⚠ Els servos MAI des de l'USB ni del 5V de l'UNO. Els cables que es creuen sense punt no es toquen.</text>
