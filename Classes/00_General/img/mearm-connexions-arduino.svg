  <polyline class="w gnd" points="200,450 770,450"/>
  <text class="lbl2" x="215" y="424">5V Arduino</text>
  <text class="lbl2" x="215" y="466">GND Arduino</text>
  <polyline class="w v5" points="338,490 338,430"/>
  <circle cx="338" cy="430" r="4.5" fill="#0e1b1c"/>
  <polyline class="w gnd" points="382,490 382,450"/>
  <circle cx="382" cy="450" r="4.5" fill="#0e1b1c"/>
