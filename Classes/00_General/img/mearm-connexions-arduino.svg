  <text class="lbl2" x="248" y="278">(imprescindible)</text>
  <rect class="placa" x="30" y="282" width="170" height="350" rx="10"/>
  <text class="lbl" x="95" y="470" text-anchor="middle" transform="rotate(-90 95 470)">ARDUINO UNO</text>
  <text class="pin" x="192" y="304" text-anchor="end">GND</text>
  <circle cx="200" cy="300" r="3.5" fill="#0c6e70"/>
  <text class="pin" x="192" y="324" text-anchor="end">D6 ~</text>
  <circle cx="200" cy="320" r="3.5" fill="#0c6e70"/>
