<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" width="700" height="430" role="img" aria-labelledby="t d">
  <title id="t">Estructura del braç MeArm</title>
  <desc id="d">Vista lateral del MeArm: placa de base, base giratòria amb el servo de base, els servos esquerre i dret al lateral, les palanques que porten la pinça, el sensor de col·lisió a la base com a final de carrera, i l'ultrasons mirant l'estació de recollida on hi ha l'objecte.</desc>
  <style>
    .fr{fill:#f6faf9;stroke:#d7e6e5;stroke-width:1.5}
    .placa{fill:#e0f2f1;stroke:#0c6e70;stroke-width:2.5}
    .mb{fill:#1e293b;stroke:#0f172a;stroke-width:2}
    .servo{fill:#dbeafe;stroke:#1d4ed8;stroke-width:2}
    .pot{fill:#fef3c7;stroke:#b45309;stroke-width:2}
    .pila{fill:#fee2e2;stroke:#b91c1c;stroke-width:2}
    .w{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .sig{stroke:#f59e0b}.pos{stroke:#dc2626}.neg{stroke:#78350f}
    .v5{stroke:#be123c}.gnd{stroke:#334155}.an{stroke:#0891b2}
    .ona{fill:none;stroke:#0891b2;stroke-width:2.5;stroke-linecap:round}
    .tit{font:700 16px system-ui,'Segoe UI',sans-serif;fill:#0e1b1c}
    .lbl{font:600 13px system-ui,'Segoe UI',sans-serif;fill:#0e1b1c}
    .lbl2{font:400 12px system-ui,'Segoe UI',sans-serif;fill:#475569}
    .pin{font:700 12px 'Consolas',monospace;fill:#0c6e70}
    .pinb{font:700 12px 'Consolas',monospace;fill:#ffffff}
    .avis{font:600 12px system-ui,'Segoe UI',sans-serif;fill:#b91c1c}
    .dig{stroke:#7c3aed}
    .sens{fill:#ede9fe;stroke:#6d28d9;stroke-width:2}
  </style>
  <rect class="fr" x="1" y="1" width="698" height="428" rx="14"/>
  <line x1="40" y1="372" x2="660" y2="372" stroke="#7c5a33" stroke-width="3"/>
  <rect x="110" y="350" width="200" height="22" rx="4" fill="#ecd9b8" stroke="#7c5a33" stroke-width="2.5"/>
  <rect class="servo" x="170" y="318" width="80" height="32" rx="5"/>
  <text class="pin" x="210" y="339" text-anchor="middle">B</text>
  <path class="ona" d="M150,384 A60,10 0 0 0 270,384"/>
  <polygon points="270,384 258,378 259,390" fill="#0891b2"/>
  <rect x="160" y="230" width="100" height="88" rx="6" fill="#ecd9b8" stroke="#7c5a33" stroke-width="2.5"/>
  <rect class="servo" x="172" y="250" width="34" height="46" rx="4"/>
  <rect class="servo" x="214" y="250" width="34" height="46" rx="4"/>
  <text class="pin" x="189" y="278" text-anchor="middle">E</text>
  <text class="pin" x="231" y="278" text-anchor="middle">D</text>
  <polyline points="210,240 330,150 460,175" fill="none" stroke="#7c5a33" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="232,262 350,182 458,198" fill="none" stroke="#a16207" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="210" cy="240" r="5" fill="#0891b2"/>
  <circle cx="330" cy="150" r="5" fill="#0891b2"/>
  <circle cx="460" cy="175" r="5" fill="#0891b2"/>
  <circle cx="232" cy="262" r="5" fill="#0891b2"/>
  <circle cx="350" cy="182" r="5" fill="#0891b2"/>
  <circle cx="458" cy="198" r="5" fill="#0891b2"/>
  <rect class="servo" x="455" y="165" width="44" height="40" rx="5"/>
  <text class="pin" x="477" y="190" text-anchor="middle">P</text>
  <path d="M499,172 L540,160 L548,178" fill="none" stroke="#7c5a33" stroke-width="7" stroke-linecap="round"/>
  <path d="M499,198 L540,212 L548,194" fill="none" stroke="#7c5a33" stroke-width="7" stroke-linecap="round"/>
  <rect class="sens" x="60" y="352" width="44" height="18" rx="3"/>
  <line x1="100" y1="350" x2="116" y2="340" stroke="#6d28d9" stroke-width="2.5"/>
  <rect x="520" y="336" width="34" height="36" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <rect class="sens" x="610" y="326" width="40" height="46" rx="4"/>
  <circle cx="630" cy="340" r="7" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <circle cx="630" cy="358" r="7" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
