  <text class="lbl" x="330" y="70">pinça · servo P (D11)</text>
  <line x1="300" y1="172" x2="230" y2="126" stroke="#64748b" stroke-width="1.3"/>
  <text class="lbl" x="40" y="120">palanques: les mouen E i D</text>
  <line x1="250" y1="272" x2="296" y2="286" stroke="#64748b" stroke-width="1.3"/>
  <text class="lbl" x="300" y="290">servos E (D6) i D (D10)</text>
  <line x1="82" y1="372" x2="82" y2="396" stroke="#64748b" stroke-width="1.3"/>
  <text class="lbl" x="24" y="410">col·lisió (D2): final de carrera</text>
  <line x1="300" y1="394" x2="300" y2="400" stroke="#64748b" stroke-width="1.3"/>
  <text class="lbl" x="250" y="414">base giratòria · servo B (D9)</text>
  <line x1="537" y1="334" x2="520" y2="296" stroke="#64748b" stroke-width="1.3"/>
  <text class="lbl" x="440" y="290">estació de recollida</text>
  <line x1="630" y1="374" x2="610" y2="400" stroke="#64748b" stroke-width="1.3"/>
  <text class="lbl" x="520" y="414">ultrasons (D7/D8)</text>
</svg>
