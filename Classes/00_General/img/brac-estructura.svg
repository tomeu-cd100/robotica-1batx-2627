<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 450" width="660" height="450" role="img" aria-labelledby="t d">
  <title id="t">Estructura del braç robòtic de 3 graus de llibertat</title>
  <desc id="d">Braç de DM amb una base que gira (servo de base) subjectada per dues torres laterals, un segment 1 fins al colze (servo d'articulació), un segment 2 fins a la pinça de dos dits impresos en 3D (servo de pinça), i un sensor de col·lisió a l'abast de la pinça per a l'emergència.</desc>
  <style>
    .fr{fill:#f6faf9;stroke:#d7e6e5;stroke-width:1.5}
    .fusta{fill:#ecd9b8;stroke:#7c5a33;stroke-width:2.5}
    .dit{fill:none;stroke:#94a3b8;stroke-width:7;stroke-linecap:round}
    .guia{fill:none;stroke:#64748b;stroke-width:1.3}
    .gir{fill:none;stroke:#0891b2;stroke-width:2.5}
    .lbl{font:600 13px system-ui,'Segoe UI',sans-serif;fill:#0e1b1c}
    .lbl2{font:400 12px system-ui,'Segoe UI',sans-serif;fill:#475569}
    .padtxt{font:700 11px 'Consolas',monospace;fill:#0c6e70}
  </style>
  <rect class="fr" x="1" y="1" width="658" height="448" rx="14"/>

  <!-- Taula -->
  <line x1="110" y1="402" x2="560" y2="402" stroke="#7c5a33" stroke-width="3"/>

  <!-- Torres laterals -->
  <rect class="fusta" x="205" y="310" width="26" height="92"/>
  <rect class="fusta" x="429" y="310" width="26" height="92"/>
  <text class="padtxt" x="218" y="420" text-anchor="middle">TORRE 1</text>
  <text class="padtxt" x="442" y="420" text-anchor="middle">TORRE 2</text>

  <!-- Base giratòria + fletxa de gir -->
  <rect class="fusta" x="255" y="335" width="150" height="45" rx="8"/>
  <text class="padtxt" x="330" y="362" text-anchor="middle">BASE</text>
  <path class="gir" d="M272,391 A72,12 0 0 1 388,391"/>
  <polygon points="388,391 376,384 378,396" fill="#0891b2"/>

  <!-- Segment 1, colze, segment 2 -->
  <rect class="fusta" x="319" y="250" width="22" height="85"/>
  <text class="lbl2" x="352" y="295">SEGMENT 1</text>
  <circle class="fusta" cx="330" cy="232" r="24"/>
  <circle cx="330" cy="232" r="5" fill="#0891b2"/>
  <rect class="fusta" x="319" y="128" width="22" height="82"/>
  <text class="lbl2" x="352" y="170">SEGMENT 2</text>

  <!-- Pinça: cos + 2 dits impresos en 3D -->
  <rect class="fusta" x="305" y="105" width="50" height="24" rx="4"/>
  <path class="dit" d="M315,103 Q300,70 318,45"/>
  <path class="dit" d="M345,103 Q360,70 342,45"/>
  <line class="gir" x1="322" y1="38" x2="338" y2="38"/>
  <polygon points="320,38 327,34 327,42" fill="#0891b2"/>
  <polygon points="340,38 333,34 333,42" fill="#0891b2"/>

  <!-- Sensor de col·lisió a la taula, a l'abast de la pinça -->
  <rect x="155" y="386" width="50" height="14" rx="3" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <line x1="160" y1="384" x2="178" y2="378" stroke="#64748b" stroke-width="2"/>

  <!-- Etiquetes -->
  <text class="lbl" x="642" y="55" text-anchor="end">pinça · 2 dits impresos en 3D (servo pinça)</text>
  <line class="guia" x1="368" y1="58" x2="348" y2="70"/>

  <text class="lbl" x="18" y="42">obre / tanca</text>
  <line class="guia" x1="100" y1="38" x2="315" y2="38"/>

  <text class="lbl" x="642" y="230" text-anchor="end">colze · servo de l'articulació</text>
  <line class="guia" x1="458" y1="226" x2="356" y2="230"/>

  <text class="lbl2" x="330" y="424" text-anchor="middle">servo de gir</text>
  <line class="guia" x1="330" y1="412" x2="330" y2="397"/>

  <text class="lbl" x="642" y="330" text-anchor="end">torres de suport lateral</text>
  <line class="guia" x1="474" y1="326" x2="452" y2="330"/>

  <text class="lbl" x="18" y="372">sensor de col·lisió (emergència)</text>
  <text class="lbl2" x="18" y="390">a l'abast de la pinça</text>
  <line class="guia" x1="150" y1="390" x2="160" y2="388"/>
</svg>
