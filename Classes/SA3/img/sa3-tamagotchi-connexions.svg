<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" role="img" aria-labelledby="t d">
  <title id="t">Connexions del tamagotchi</title>
  <desc id="d">Esquema lògic. A l'esquerra, els pins de l'Arduino UNO; a la dreta, les dues files llargues de la protoboard: menys (GND) i més (5 V). El 5V de l'Arduino va a la fila més i el GND a la fila menys. Pin 2: sortida OUT del sensor de moviment PIR, que també va a 5 V i GND. Pins 3, 5 i 7: botons MENJAR, JUGAR i DORMIR, cadascun entre el pin i la fila menys. Pin 8: pota més del brunzidor; la pota menys va a la fila menys. Pins 9, 10 i 11: R, G i B del mòdul LED RGB; la seva pota menys va a la fila menys. A0: sortida OUT del micròfon, que també va a 5 V i GND. A1: punt d'unió del sensor de llum: 5 V, sensor de llum (LDR), A1, resistència de 10 kiloohms, GND. A4: SDA de la pantalla OLED. A5: SCL de la pantalla OLED, que també va a 5 V i GND.</desc>
  <style>
    .fr{fill:#f6faf9;stroke:#d7e6e5;stroke-width:1.5}
    .box{fill:#ffffff;stroke:#0e1b1c;stroke-width:2}
    .mod{fill:#e8f1fb;stroke:#1d4ed8;stroke-width:2}
    .w{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .v5{stroke:#dc2626}.gnd{stroke:#0e1b1c}.sig{stroke:#7c3aed}
    .scl{stroke:#ea580c}.sda{stroke:#2563eb}
    .r{stroke:#e11d48}.g{stroke:#16a34a}.b{stroke:#2563eb}
    .lbl{font:700 14px system-ui,'Segoe UI',sans-serif;fill:#0e1b1c}
    .mut{font:600 12.5px system-ui,'Segoe UI',sans-serif;fill:#4f6d6e}
    .pin{font:700 13px 'Consolas',monospace;fill:#0e1b1c}
    .tit{font:800 13px system-ui,sans-serif;fill:#0c6e70;letter-spacing:.04em}
  </style>
  <rect class="fr" x="1" y="1" width="898" height="798" rx="14"/>

  <!-- ================= Arduino ================= -->
  <rect class="box" x="30" y="40" width="140" height="690" rx="10"/>
  <text class="lbl" x="92" y="66" text-anchor="middle">Arduino</text>
  <text class="lbl" x="92" y="84" text-anchor="middle">UNO</text>
  <g class="pin" text-anchor="end">
    <text x="160" y="87">2</text>
    <text x="160" y="137">3</text>
    <text x="160" y="182">5</text>
    <text x="160" y="227">7</text>
    <text x="160" y="282">8</text>
    <text x="160" y="332">9</text>
    <text x="160" y="357">10</text>
    <text x="160" y="382">11</text>
    <text x="160" y="437">A0</text>
    <text x="160" y="497">A1</text>
    <text x="160" y="562">A4</text>
    <text x="160" y="587">A5</text>
    <text x="160" y="657">5V</text>
    <text x="160" y="697">GND</text>
  </g>

  <!-- ================= Files de la protoboard ================= -->
  <text class="tit" x="820" y="28" text-anchor="middle">PROTOBOARD</text>
  <text class="lbl" x="800" y="54" text-anchor="middle">−</text>
  <text class="lbl" x="840" y="54" text-anchor="middle">+</text>
  <line class="w gnd" x1="800" y1="64" x2="800" y2="700" stroke-width="5"/>
  <line class="w v5"  x1="840" y1="64" x2="840" y2="700" stroke-width="5"/>
  <text class="mut" x="800" y="722" text-anchor="middle">blava</text>
  <text class="mut" x="840" y="738" text-anchor="middle">vermella</text>

  <!-- 5V i GND de l'Arduino a les files -->
  <path class="w v5" d="M170,652 H792 a8,8 0 0 1 16,0 H840"/>
  <line class="w gnd" x1="170" y1="692" x2="800" y2="692"/>

  <!-- ================= Pin 2 · PIR ================= -->
  <line class="w sig" x1="170" y1="82" x2="300" y2="82"/>
  <rect class="mod" x="300" y="60" width="300" height="48" rx="8"/>
  <text class="pin" x="308" y="87">OUT</text>
  <text class="lbl" x="360" y="81">Sensor de moviment (PIR)</text>
  <text class="mut" x="360" y="99">tarda 30-60 s a funcionar</text>
  <text class="pin" x="592" y="78" text-anchor="end">VCC</text>
  <text class="pin" x="592" y="101" text-anchor="end">GND</text>
  <path class="w v5" d="M600,74 H792 a8,8 0 0 1 16,0 H840"/>
  <line class="w gnd" x1="600" y1="96" x2="800" y2="96"/>

  <!-- ================= Pins 3, 5, 7 · botons ================= -->
  <g>
    <line class="w sig" x1="170" y1="132" x2="330" y2="132"/>
    <line class="w sig" x1="170" y1="177" x2="330" y2="177"/>
    <line class="w sig" x1="170" y1="222" x2="330" y2="222"/>
    <line class="w gnd" x1="370" y1="132" x2="800" y2="132"/>
    <line class="w gnd" x1="370" y1="177" x2="800" y2="177"/>
    <line class="w gnd" x1="370" y1="222" x2="800" y2="222"/>
  </g>
  <g fill="#ffffff" stroke="#0e1b1c" stroke-width="2.2">
    <circle cx="334" cy="132" r="4"/><circle cx="366" cy="132" r="4"/>
    <circle cx="334" cy="177" r="4"/><circle cx="366" cy="177" r="4"/>
    <circle cx="334" cy="222" r="4"/><circle cx="366" cy="222" r="4"/>
  </g>
  <g stroke="#0e1b1c" stroke-width="2.4" stroke-linecap="round">
    <line x1="326" y1="121" x2="374" y2="121"/><line x1="350" y1="121" x2="350" y2="113"/><line x1="342" y1="113" x2="358" y2="113"/>
    <line x1="326" y1="166" x2="374" y2="166"/><line x1="350" y1="166" x2="350" y2="158"/><line x1="342" y1="158" x2="358" y2="158"/>
    <line x1="326" y1="211" x2="374" y2="211"/><line x1="350" y1="211" x2="350" y2="203"/><line x1="342" y1="203" x2="358" y2="203"/>
  </g>
  <text class="lbl" x="390" y="126">MENJAR</text>
  <text class="lbl" x="390" y="171">JUGAR</text>
  <text class="lbl" x="390" y="216">DORMIR</text>
  <text class="mut" x="480" y="171">botó entre el pin i la fila −</text>
  <text class="mut" x="480" y="216">(INPUT_PULLUP: sense resistència)</text>

  <!-- ================= Pin 8 · brunzidor ================= -->
  <line class="w sig" x1="170" y1="277" x2="334" y2="277"/>
  <circle cx="352" cy="277" r="18" fill="#ffffff" stroke="#0e1b1c" stroke-width="2.2"/>
  <circle cx="352" cy="277" r="6" fill="#0e1b1c"/>
  <text class="pin" x="326" y="262" text-anchor="end">+</text>
  <text class="pin" x="378" y="262">−</text>
  <line class="w gnd" x1="370" y1="277" x2="800" y2="277"/>
  <text class="lbl" x="390" y="271">Brunzidor</text>

  <!-- ================= Pins 9, 10, 11 · LED RGB ================= -->
  <line class="w r" x1="170" y1="327" x2="300" y2="327"/>
  <line class="w g" x1="170" y1="352" x2="300" y2="352"/>
  <line class="w b" x1="170" y1="377" x2="300" y2="377"/>
  <rect class="mod" x="300" y="312" width="300" height="80" rx="8"/>
  <text class="pin" x="308" y="332">R</text>
  <text class="pin" x="308" y="357">G</text>
  <text class="pin" x="308" y="382">B</text>
  <text class="lbl" x="450" y="348" text-anchor="middle">Mòdul LED RGB (humor)</text>
  <text class="mut" x="450" y="368" text-anchor="middle">LED solt: 220 Ω a cada color</text>
  <text class="pin" x="592" y="357" text-anchor="end">−</text>
  <line class="w gnd" x1="600" y1="352" x2="800" y2="352"/>

  <!-- ================= A0 · micròfon ================= -->
  <line class="w sig" x1="170" y1="432" x2="300" y2="432"/>
  <rect class="mod" x="300" y="408" width="300" height="48" rx="8"/>
  <text class="pin" x="308" y="437">OUT</text>
  <text class="lbl" x="360" y="437">Micròfon (soroll)</text>
  <text class="pin" x="592" y="426" text-anchor="end">VCC</text>
  <text class="pin" x="592" y="449" text-anchor="end">GND</text>
  <path class="w v5" d="M600,422 H792 a8,8 0 0 1 16,0 H840"/>
  <line class="w gnd" x1="600" y1="444" x2="800" y2="444"/>

  <!-- ================= A1 · sensor de llum (divisor) ================= -->
  <line class="w sig" x1="170" y1="492" x2="420" y2="492"/>
  <circle cx="420" cy="492" r="5" fill="#7c3aed"/>
  <!-- A1 -> LDR -> 5 V -->
  <line class="w sig" x1="420" y1="492" x2="470" y2="492"/>
  <rect x="470" y="482" width="90" height="20" rx="10" fill="#fef3c7" stroke="#0e1b1c" stroke-width="2"/>
  <path d="M482,492 q6,-7 12,0 t12,0 t12,0 t12,0 t12,0 t12,0" fill="none" stroke="#b45309" stroke-width="2"/>
  <path d="M488,466 l12,12 M500,466 l12,12" stroke="#ca8a04" stroke-width="2"/>
  <path class="w v5" d="M560,492 H792 a8,8 0 0 1 16,0 H840"/>
  <text class="lbl" x="580" y="484">sensor de llum (LDR)</text>
  <!-- A1 -> 10 kΩ -> GND -->
  <polyline class="w sig" points="420,492 420,522 470,522"/>
  <rect x="470" y="513" width="90" height="18" rx="3" fill="#ffffff" stroke="#0e1b1c" stroke-width="2"/>
  <g stroke-width="5"><line x1="492" y1="514" x2="492" y2="530" stroke="#92400e"/><line x1="506" y1="514" x2="506" y2="530" stroke="#0e1b1c"/><line x1="520" y1="514" x2="520" y2="530" stroke="#ea580c"/></g>
  <line class="w gnd" x1="560" y1="522" x2="800" y2="522"/>
  <text class="lbl" x="580" y="514">10 kΩ</text>
  <text class="mut" x="200" y="478">5 V → LDR → A1 → 10 kΩ → GND</text>

  <!-- ================= A4, A5 · pantalla OLED ================= -->
  <line class="w sda" x1="170" y1="557" x2="300" y2="557"/>
  <line class="w scl" x1="170" y1="582" x2="300" y2="582"/>
  <rect class="mod" x="300" y="540" width="300" height="60" rx="8"/>
  <text class="pin" x="308" y="562">SDA</text>
  <text class="pin" x="308" y="587">SCL</text>
  <text class="lbl" x="450" y="568" text-anchor="middle">Pantalla OLED</text>
  <text class="mut" x="450" y="586" text-anchor="middle">com a la Pràctica 3</text>
  <text class="pin" x="592" y="562" text-anchor="end">VCC</text>
  <text class="pin" x="592" y="587" text-anchor="end">GND</text>
  <path class="w v5" d="M600,557 H792 a8,8 0 0 1 16,0 H840"/>
  <line class="w gnd" x1="600" y1="582" x2="800" y2="582"/>

  <!-- ================= Unions amb les files ================= -->
  <g fill="#0e1b1c">
    <circle cx="800" cy="96" r="5"/><circle cx="800" cy="132" r="5"/><circle cx="800" cy="177" r="5"/>
    <circle cx="800" cy="222" r="5"/><circle cx="800" cy="277" r="5"/><circle cx="800" cy="352" r="5"/>
    <circle cx="800" cy="444" r="5"/><circle cx="800" cy="522" r="5"/><circle cx="800" cy="582" r="5"/>
    <circle cx="800" cy="692" r="5"/>
  </g>
  <g fill="#dc2626">
    <circle cx="840" cy="74" r="5"/><circle cx="840" cy="422" r="5"/><circle cx="840" cy="492" r="5"/>
    <circle cx="840" cy="557" r="5"/><circle cx="840" cy="652" r="5"/>
  </g>

  <!-- ================= Avisos ================= -->
  <text class="mut" x="200" y="632">Esquema lògic: a l'ou, cada peça va al seu forat, però els cables són aquests.</text>
  <text class="mut" x="30" y="762">⚠️ PIR, micròfon i pantalla: l'ordre de les potes canvia segons el model. Connecta per les lletres</text>
  <text class="mut" x="30" y="780">(VCC, GND, OUT o S, SDA, SCL), no per la posició. Un punt (•) vol dir que el cable s'uneix a la fila.</text>
</svg>
