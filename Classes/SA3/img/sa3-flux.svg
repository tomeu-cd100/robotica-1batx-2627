<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" width="720" height="490" role="img" aria-labelledby="t d"><title id="t">Flux de la llum automatica (sensor + llindar)</title><desc id="d">El loop llegeix el sensor analogic i decideix per llindar: si la llum es per sota del llindar encen el LED; si no, l&#x27;apaga. I torna a comencar.</desc><style>
  .fr{fill:#f6faf9;stroke:#d7e6e5;stroke-width:1.5}
  .box{fill:#eaf3f2;stroke:#0891b2;stroke-width:1.8}
  .start{fill:#0891b2;stroke:#0e7490;stroke-width:1.8}
  .startt{font:700 14px system-ui,'Segoe UI',sans-serif;fill:#ffffff}
  .dec{fill:#fff7ed;stroke:#b45309;stroke-width:1.9}
  .boxt{font:600 13.5px system-ui,'Segoe UI',sans-serif;fill:#0e1b1c}
  .dect{font:700 13px system-ui,'Segoe UI',sans-serif;fill:#7c3a06}
  .wire{fill:none;stroke:#0891b2;stroke-width:2.3}
  .loop{fill:none;stroke:#b45309;stroke-width:2.3;stroke-dasharray:1 0}
  .lbl{font:700 12px system-ui,'Segoe UI',sans-serif;fill:#b45309}
  .yes{font:700 12px system-ui,'Segoe UI',sans-serif;fill:#0e7490}
</style><defs><marker id="m" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0891b2"/></marker><marker id="mo" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b45309"/></marker></defs><rect class="fr" x="1" y="1" width="718" height="488" rx="14"/><path class="wire" d="M360,98 L360,142" marker-end="url(#m)"/><path class="wire" d="M360,196 L360,240" marker-end="url(#m)"/><rect class="start" x="210" y="46" width="300" height="52" rx="11"/><text class="startt" x="360" y="72" text-anchor="middle">Engego la placa</text><rect class="box" x="210" y="144" width="300" height="52" rx="11"/><text class="boxt" x="360" y="162" text-anchor="middle">Llegeixo el sensor (analogRead,</text><text class="boxt" x="360" y="178" text-anchor="middle">0-1023)</text><polygon class="dec" points="360,242 475,290 360,338 245,290"/><text class="dect" x="360" y="290" text-anchor="middle">llum &lt; LLINDAR ?</text><path class="wire" d="M360,338 L240,342" marker-end="url(#m)"/><rect x="205" y="330" width="71" height="18" rx="5" fill="#f6faf9"/><text class="yes" x="240" y="343" text-anchor="middle">SÍ (fosc)</text><rect class="box" x="145" y="358" width="190" height="56" rx="11"/><text class="boxt" x="240" y="386" text-anchor="middle">Encenc el LED</text><path class="wire" d="M240,414 L240,436"/><path class="wire" d="M360,338 L480,342" marker-end="url(#m)"/><rect x="445" y="330" width="71" height="18" rx="5" fill="#f6faf9"/><text class="yes" x="480" y="343" text-anchor="middle">NO (clar)</text><rect class="box" x="385" y="358" width="190" height="56" rx="11"/><text class="boxt" x="480" y="386" text-anchor="middle">Apago el LED</text><path class="wire" d="M480,414 L480,436"/><path class="wire" d="M240,436 L480,436"/><path class="loop" d="M360,436 L180,436 L40,436 L40,170 L208,170" marker-end="url(#mo)"/><text class="lbl" x="48" y="303" transform="rotate(-90 48 303)" text-anchor="middle">cada volta</text></svg>