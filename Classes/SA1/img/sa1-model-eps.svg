<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d">
  <title id="t">Model entrada, procés i sortida</title>
  <desc id="d">Tres blocs connectats: entrada (sensors) porta al procés (microcontrolador o cervell), que porta a la sortida (actuadors).</desc>
  <style>
    .card{fill:#ffffff;stroke:#b7d0cf;stroke-width:1.5}
    .lbl{font:700 22px system-ui,'Segoe UI',sans-serif}
    .sub{font:600 14px system-ui,'Segoe UI',sans-serif;fill:#4f6d6e}
    .ex{font:400 13px system-ui,'Segoe UI',sans-serif;fill:#0e1b1c}
    .cap{font:700 12px system-ui,'Segoe UI',sans-serif;letter-spacing:.08em}
    .frame{fill:#f6faf9;stroke:#d7e6e5;stroke-width:1.5}
  </style>
  <rect class="frame" x="1" y="1" width="758" height="298" rx="14"/>

  <!-- ENTRADA -->
  <rect class="card" x="28" y="60" width="180" height="96" rx="12" stroke="#2563eb"/>
  <rect x="28" y="60" width="180" height="30" rx="12" fill="#2563eb"/>
  <rect x="28" y="76" width="180" height="14" fill="#2563eb"/>
  <text class="cap" x="118" y="80" text-anchor="middle" fill="#ffffff">ENTRADA</text>
  <text class="lbl" x="118" y="124" text-anchor="middle" fill="#0e1b1c">Sensors</text>
  <text class="sub" x="118" y="145" text-anchor="middle">què percep?</text>

  <!-- PROCÉS -->
  <rect class="card" x="290" y="60" width="180" height="96" rx="12" stroke="#0891b2"/>
  <rect x="290" y="60" width="180" height="30" rx="12" fill="#0891b2"/>
  <rect x="290" y="76" width="180" height="14" fill="#0891b2"/>
  <text class="cap" x="380" y="80" text-anchor="middle" fill="#ffffff">PROCÉS</text>
  <text class="lbl" x="380" y="124" text-anchor="middle" fill="#0e1b1c">Cervell</text>
  <text class="sub" x="380" y="145" text-anchor="middle">què decideix?</text>

  <!-- SORTIDA -->
  <rect class="card" x="552" y="60" width="180" height="96" rx="12" stroke="#d97706"/>
  <rect x="552" y="60" width="180" height="30" rx="12" fill="#d97706"/>
  <rect x="552" y="76" width="180" height="14" fill="#d97706"/>
  <text class="cap" x="642" y="80" text-anchor="middle" fill="#ffffff">SORTIDA</text>
  <text class="lbl" x="642" y="124" text-anchor="middle" fill="#0e1b1c">Actuadors</text>
  <text class="sub" x="642" y="145" text-anchor="middle">què fa?</text>

  <!-- Fletxes -->
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#4f6d6e"/>
    </marker>
  </defs>
  <line x1="212" y1="108" x2="284" y2="108" stroke="#4f6d6e" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="474" y1="108" x2="546" y2="108" stroke="#4f6d6e" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- Exemple: semàfor -->
  <text class="sub" x="30" y="210" fill="#0e1b1c">Exemple · semàfor:</text>
  <text class="ex" x="118" y="248" text-anchor="middle">temporitzador,</text>
  <text class="ex" x="118" y="266" text-anchor="middle">sensor de cotxes</text>
  <text class="ex" x="380" y="248" text-anchor="middle">seqüència de</text>
  <text class="ex" x="380" y="266" text-anchor="middle">fases (vermell…)</text>
  <text class="ex" x="642" y="248" text-anchor="middle">llums vermell,</text>
  <text class="ex" x="642" y="266" text-anchor="middle">groc i verd</text>
</svg>
