<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-labelledby="t d">
  <title id="t">Anatomia de la placa Arduino UNO (versió muda per etiquetar)</title>
  <desc id="d">Placa Arduino UNO en blanc i negre amb requadres buits per escriure el nom de cada part: connector, pins digitals, microcontrolador, pins d'alimentació i entrades analògiques.</desc>
  <style>
    .fr{fill:#ffffff;stroke:#333;stroke-width:1.5}
    .board{fill:#ffffff;stroke:#111;stroke-width:2}
    .hdr{fill:#ffffff;stroke:#111;stroke-width:1.5}
    .pinlbl{font:600 12px 'Consolas',monospace;fill:#111}
    .chip{fill:#ffffff;stroke:#111;stroke-width:1.5}
    .box{fill:#ffffff;stroke:#111;stroke-width:1.2}
    .num{font:700 13px system-ui,sans-serif;fill:#111}
    .lead{stroke:#111;stroke-width:1.2;fill:none}
    .dot{fill:#111}
    .line{font:600 13px system-ui,sans-serif;fill:#666}
  </style>
  <rect class="fr" x="1" y="1" width="858" height="468" rx="14"/>

  <rect class="board" x="150" y="150" width="560" height="180" rx="10"/>
  <rect x="112" y="176" width="46" height="46" rx="3" class="hdr"/>
  <rect x="116" y="262" width="42" height="36" rx="6" class="hdr"/>

  <!-- Capçalera pins digitals amb els números impresos (com a la placa real) -->
  <rect class="hdr" x="172" y="164" width="516" height="20" rx="3"/>
  <g class="pinlbl" text-anchor="middle">
    <text x="190" y="178">13</text><text x="228" y="178">12</text>
    <text x="266" y="178">~11</text><text x="304" y="178">~10</text>
    <text x="342" y="178">~9</text><text x="380" y="178">8</text>
    <text x="418" y="178">7</text><text x="456" y="178">~6</text>
    <text x="494" y="178">~5</text><text x="532" y="178">4</text>
    <text x="570" y="178">~3</text><text x="608" y="178">2</text>
    <text x="646" y="178">1</text><text x="672" y="178">0</text>
  </g>
  <circle cx="196" cy="205" r="9" class="hdr"/>

  <rect class="chip" x="360" y="222" width="150" height="60" rx="4"/>
  <rect class="hdr" x="196" y="296" width="228" height="20" rx="3"/>
  <g class="pinlbl" text-anchor="middle">
    <text x="222" y="310">RST</text><text x="264" y="310">3V3</text>
    <text x="304" y="310">5V</text><text x="344" y="310">GND</text>
    <text x="392" y="310">Vin</text>
  </g>
  <rect class="hdr" x="452" y="296" width="220" height="20" rx="3"/>
  <g class="pinlbl" text-anchor="middle">
    <text x="474" y="310">A0</text><text x="512" y="310">A1</text>
    <text x="550" y="310">A2</text><text x="588" y="310">A3</text>
    <text x="626" y="310">A4</text><text x="660" y="310">A5</text>
  </g>

  <!-- Requadres buits numerats + línia guia -->
  <!-- 1 · USB -->
  <rect class="box" x="20" y="118" width="130" height="38" rx="6"/>
  <text class="num" x="30" y="133">1</text>
  <line x1="44" y1="142" x2="142" y2="142" stroke="#bbb"/>
  <path class="lead" d="M135,156 L135,176"/><circle class="dot" cx="135" cy="176" r="2.5"/>

  <!-- 2 · Jack -->
  <rect class="box" x="14" y="316" width="136" height="38" rx="6"/>
  <text class="num" x="24" y="331">2</text>
  <line x1="38" y1="340" x2="142" y2="340" stroke="#bbb"/>
  <path class="lead" d="M137,316 L137,298"/><circle class="dot" cx="137" cy="298" r="2.5"/>

  <!-- 3 · Pins digitals -->
  <rect class="box" x="300" y="92" width="270" height="38" rx="6"/>
  <text class="num" x="310" y="107">3</text>
  <line x1="324" y1="116" x2="562" y2="116" stroke="#bbb"/>
  <path class="lead" d="M435,130 L435,164"/><circle class="dot" cx="435" cy="164" r="2.5"/>

  <!-- 4 · LED intern -->
  <rect class="box" x="600" y="118" width="180" height="38" rx="6"/>
  <text class="num" x="610" y="133">4</text>
  <line x1="624" y1="142" x2="772" y2="142" stroke="#bbb"/>
  <path class="lead" d="M600,138 C420,150 250,180 205,200"/><circle class="dot" cx="205" cy="200" r="2.5"/>

  <!-- 5 · Microcontrolador -->
  <rect class="box" x="560" y="224" width="270" height="38" rx="6"/>
  <text class="num" x="570" y="239">5</text>
  <line x1="584" y1="248" x2="822" y2="248" stroke="#bbb"/>
  <path class="lead" d="M560,244 L510,250"/><circle class="dot" cx="510" cy="250" r="2.5"/>

  <!-- 6 · Alimentació -->
  <rect class="box" x="120" y="392" width="210" height="38" rx="6"/>
  <text class="num" x="130" y="407">6</text>
  <line x1="144" y1="416" x2="322" y2="416" stroke="#bbb"/>
  <path class="lead" d="M290,392 L310,318"/><circle class="dot" cx="310" cy="318" r="2.5"/>

  <!-- 7 · Analògiques -->
  <rect class="box" x="470" y="392" width="230" height="38" rx="6"/>
  <text class="num" x="480" y="407">7</text>
  <line x1="494" y1="416" x2="692" y2="416" stroke="#bbb"/>
  <path class="lead" d="M560,392 L560,318"/><circle class="dot" cx="560" cy="318" r="2.5"/>
</svg>
