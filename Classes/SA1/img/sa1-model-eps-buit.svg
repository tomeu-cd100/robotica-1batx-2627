<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-labelledby="t d">
  <title id="t">Diagrama per omplir del model entrada, procés i sortida</title>
  <desc id="d">Tres blocs buits amb línies per escriure-hi, units per fletxes: entrada (sensors, què percep?), procés (cervell, què decideix?) i sortida (actuadors, què fa?).</desc>
  <style>
    .card{fill:#ffffff;stroke-width:1.5}
    .sub{font:600 13px system-ui,'Segoe UI',sans-serif;fill:#4f6d6e}
    .cap{font:700 12px system-ui,'Segoe UI',sans-serif;letter-spacing:.08em}
    .frame{fill:#f6faf9;stroke:#d7e6e5;stroke-width:1.5}
    .ratlla{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 4}
  </style>
  <rect class="frame" x="1" y="1" width="758" height="258" rx="14"/>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#4f6d6e"/>
    </marker>
  </defs>

  <!-- ENTRADA -->
  <rect class="card" x="28" y="40" width="180" height="180" rx="12" stroke="#2563eb"/>
  <rect x="28" y="40" width="180" height="30" rx="12" fill="#2563eb"/>
  <rect x="28" y="56" width="180" height="14" fill="#2563eb"/>
  <text class="cap" x="118" y="60" text-anchor="middle" fill="#ffffff">ENTRADA</text>
  <text class="sub" x="118" y="90" text-anchor="middle">sensors · què percep?</text>
  <line class="ratlla" x1="44" y1="125" x2="192" y2="125"/>
  <line class="ratlla" x1="44" y1="160" x2="192" y2="160"/>
  <line class="ratlla" x1="44" y1="195" x2="192" y2="195"/>

  <!-- PROCÉS -->
  <rect class="card" x="290" y="40" width="180" height="180" rx="12" stroke="#0891b2"/>
  <rect x="290" y="40" width="180" height="30" rx="12" fill="#0891b2"/>
  <rect x="290" y="56" width="180" height="14" fill="#0891b2"/>
  <text class="cap" x="380" y="60" text-anchor="middle" fill="#ffffff">PROCÉS</text>
  <text class="sub" x="380" y="90" text-anchor="middle">cervell · què decideix?</text>
  <line class="ratlla" x1="306" y1="125" x2="454" y2="125"/>
  <line class="ratlla" x1="306" y1="160" x2="454" y2="160"/>
  <line class="ratlla" x1="306" y1="195" x2="454" y2="195"/>

  <!-- SORTIDA -->
  <rect class="card" x="552" y="40" width="180" height="180" rx="12" stroke="#d97706"/>
  <rect x="552" y="40" width="180" height="30" rx="12" fill="#d97706"/>
  <rect x="552" y="56" width="180" height="14" fill="#d97706"/>
  <text class="cap" x="642" y="60" text-anchor="middle" fill="#ffffff">SORTIDA</text>
  <text class="sub" x="642" y="90" text-anchor="middle">actuadors · què fa?</text>
  <line class="ratlla" x1="568" y1="125" x2="716" y2="125"/>
  <line class="ratlla" x1="568" y1="160" x2="716" y2="160"/>
  <line class="ratlla" x1="568" y1="195" x2="716" y2="195"/>

  <!-- Fletxes -->
  <line x1="212" y1="130" x2="284" y2="130" stroke="#4f6d6e" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="474" y1="130" x2="546" y2="130" stroke="#4f6d6e" stroke-width="2.5" marker-end="url(#ar)"/>
</svg>
