<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-labelledby="t d">
  <title id="t">Circuit del Blink amb LED extern</title>
  <desc id="d">El pin 13 de l'Arduino es connecta a una resistència de 220 ohms, després a l'ànode (pota llarga, positiu) del LED; el càtode (pota curta, negatiu) del LED va a GND.</desc>
  <style>
    .fr{fill:#f6faf9;stroke:#d7e6e5;stroke-width:1.5}
    .wire{stroke:#0e1b1c;stroke-width:2.5;fill:none}
    .pad{fill:#ffffff;stroke:#0891b2;stroke-width:2}
    .padtxt{font:700 14px 'Consolas',monospace;fill:#0c6e70}
    .comp{font:600 14px system-ui,'Segoe UI',sans-serif;fill:#0e1b1c}
    .pol{font:600 12.5px system-ui,'Segoe UI',sans-serif;fill:#4f6d6e}
    .plus{font:700 18px system-ui,sans-serif;fill:#d97706}
    .minus{font:700 18px system-ui,sans-serif;fill:#2563eb}
  </style>
  <rect class="fr" x="1" y="1" width="718" height="258" rx="14"/>

  <!-- Pin 13 -->
  <rect class="pad" x="40" y="108" width="86" height="40" rx="8"/>
  <text class="padtxt" x="83" y="133" text-anchor="middle">PIN 13</text>

  <!-- Wire pin -> resistor -->
  <line class="wire" x1="126" y1="128" x2="196" y2="128"/>

  <!-- Resistor (zigzag) -->
  <polyline class="wire" points="196,128 208,128 214,114 226,142 238,114 250,142 262,114 268,128 300,128"/>
  <text class="comp" x="232" y="98" text-anchor="middle">220 Ω</text>

  <!-- Wire resistor -> LED -->
  <line class="wire" x1="300" y1="128" x2="392" y2="128"/>

  <!-- LED symbol (triangle + bar, anode left) -->
  <polygon points="392,108 392,148 428,128" fill="#ffffff" stroke="#0e1b1c" stroke-width="2.5"/>
  <line class="wire" x1="428" y1="106" x2="428" y2="150"/>
  <!-- emission arrows -->
  <line class="wire" x1="410" y1="98" x2="424" y2="84" stroke-width="1.8"/>
  <path d="M424,84 l-8,1 l4,6 z" fill="#0e1b1c"/>
  <line class="wire" x1="422" y1="98" x2="436" y2="84" stroke-width="1.8"/>
  <path d="M436,84 l-8,1 l4,6 z" fill="#0e1b1c"/>

  <!-- Wire LED -> GND -->
  <line class="wire" x1="428" y1="128" x2="560" y2="128"/>

  <!-- GND symbol -->
  <line class="wire" x1="560" y1="108" x2="560" y2="128"/>
  <line class="wire" x1="536" y1="150" x2="584" y2="150"/>
  <line class="wire" x1="544" y1="164" x2="576" y2="164"/>
  <line class="wire" x1="552" y1="178" x2="568" y2="178"/>
  <text class="comp" x="560" y="206" text-anchor="middle">GND</text>

  <!-- Polaritat -->
  <text class="plus" x="384" y="176" text-anchor="middle">+</text>
  <text class="pol" x="384" y="196" text-anchor="middle">ànode</text>
  <text class="pol" x="384" y="212" text-anchor="middle">pota llarga</text>
  <text class="minus" x="446" y="176" text-anchor="middle">−</text>
  <text class="pol" x="452" y="196" text-anchor="middle">càtode</text>
  <text class="pol" x="452" y="212" text-anchor="middle">pota curta</text>
</svg>
