<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 686" width="720" height="686" role="img" aria-labelledby="t d"><title id="t">Flux del metode de projecte</title><desc id="d">S&#x27;analitza (requisits, MVP) i es dissenya; despres el cicle construir-provar es repeteix: si funciona es documenta i es lliura, si no es millora i es torna a construir (iteracio).</desc><style>
