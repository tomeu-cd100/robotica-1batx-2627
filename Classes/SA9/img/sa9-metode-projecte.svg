<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-labelledby="t d">
  <title id="t">El mètode de projecte del curs</title>
  <desc id="d">El cicle d'enginyeria que es fa servir a tot el curs: analitzar, dissenyar, prototipar, provar i millorar. Després de millorar es torna a provar i el cicle es repeteix en iteracions fins a tenir la solució.</desc>
  <style>
    .fr{fill:#f6faf9;stroke:#d7e6e5;stroke-width:1.5}
    .box{fill:#eaf3f2;stroke:#0891b2;stroke-width:1.8}
    .boxt{font:700 14px system-ui,'Segoe UI',sans-serif;fill:#0e1b1c}
    .num{font:700 12px 'Consolas',monospace;fill:#0c6e70}
    .wire{fill:none;stroke:#0891b2;stroke-width:2.4}
    .loop{fill:none;stroke:#b45309;stroke-width:2.4}
    .lbl{font:600 12.5px system-ui,'Segoe UI',sans-serif;fill:#b45309}
  </style>
  <defs>
    <marker id="m" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0891b2"/></marker>
    <marker id="mo" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b45309"/></marker>
  </defs>
  <rect class="fr" x="1" y="1" width="758" height="258" rx="14"/>

  <!-- 5 fases -->
  <g>
    <rect class="box" x="24" y="80" width="118" height="60" rx="10"/><text class="num" x="83" y="104" text-anchor="middle">1</text><text class="boxt" x="83" y="126" text-anchor="middle">Analitzar</text>
    <rect class="box" x="172" y="80" width="118" height="60" rx="10"/><text class="num" x="231" y="104" text-anchor="middle">2</text><text class="boxt" x="231" y="126" text-anchor="middle">Dissenyar</text>
    <rect class="box" x="320" y="80" width="118" height="60" rx="10"/><text class="num" x="379" y="104" text-anchor="middle">3</text><text class="boxt" x="379" y="126" text-anchor="middle">Prototipar</text>
    <rect class="box" x="468" y="80" width="118" height="60" rx="10"/><text class="num" x="527" y="104" text-anchor="middle">4</text><text class="boxt" x="527" y="126" text-anchor="middle">Provar</text>
    <rect class="box" x="616" y="80" width="118" height="60" rx="10"/><text class="num" x="675" y="104" text-anchor="middle">5</text><text class="boxt" x="675" y="126" text-anchor="middle">Millorar</text>
  </g>
  <!-- fletxes -->
  <line class="wire" x1="142" y1="110" x2="170" y2="110" marker-end="url(#m)"/>
  <line class="wire" x1="290" y1="110" x2="318" y2="110" marker-end="url(#m)"/>
  <line class="wire" x1="438" y1="110" x2="466" y2="110" marker-end="url(#m)"/>
  <line class="wire" x1="586" y1="110" x2="614" y2="110" marker-end="url(#m)"/>

  <!-- loop iteració: de Millorar cap a Provar -->
  <path class="loop" d="M675,140 V196 H527 V142" marker-end="url(#mo)"/>
  <text class="lbl" x="601" y="214" text-anchor="middle">es repeteix (iteració): provar → millorar → provar…</text>
</svg>
