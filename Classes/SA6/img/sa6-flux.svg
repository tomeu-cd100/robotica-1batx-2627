="540" y="386" text-anchor="middle">Mantinc l&#x27;estat</text><path class="wire" d="M540,414 L540,436"/><path class="wire" d="M180,436 L540,436"/><path class="loop" d="M360,436 L180,436 L40,436 L40,170 L208,170" marker-end="url(#mo)"/><text class="lbl" x="48" y="303" transform="rotate(-90 48 303)" text-anchor="middle">llaç tancat</text></svg>