<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" width="720" height="490" role="img" aria-labelledby="t d"><title id="t">Flux del control amb histeresi</title><desc id="d">Llaç tancat: es llegeix el sensor i, amb dos llindars (histeresi), s&#x27;engega per sota del llindar baix i s&#x27;atura per sobre de l&#x27;alt; enmig es mante l&#x27;estat.</desc><style>
  .fr{fill:#f6faf9;stroke:#d7e6e5;stroke-width:1.5}
