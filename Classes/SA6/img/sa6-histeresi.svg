<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350" role="img" aria-labelledby="t d">
  <title id="t">Control tot/res amb histèresi</title>
  <desc id="d">Gràfica de la sortida de l'actuador segons la temperatura amb dos llindars. Entre el llindar baix i l'alt hi ha una zona morta: l'actuador manté el seu estat, de manera que no vibra a prop del punt de consigna.</desc>
  <style>
    .fr{fill:#f6faf9;stroke:#d7e6e5;stroke-width:1.5}
    .axis{stroke:#0e1b1c;stroke-width:1.8}
    .grid{stroke:#b7d0cf;stroke-width:1.2;stroke-dasharray:5 4}
    .loop{fill:none;stroke:#0891b2;stroke-width:3}
    .lbl{font:600 13px system-ui,'Segoe UI',sans-serif;fill:#0e1b1c}
    .mut{font:600 12px system-ui,'Segoe UI',sans-serif;fill:#4f6d6e}
  </style>
  <defs>
    <marker id="lp" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0891b2"/></marker>
  </defs>
  <rect class="fr" x="1" y="1" width="638" height="348" rx="14"/>

  <!-- Eixos -->
  <line class="axis" x1="90" y1="70" x2="90" y2="280"/>
  <line class="axis" x1="90" y1="280" x2="580" y2="280"/>
  <text class="lbl" x="70" y="66" text-anchor="end">sortida</text>
  <text class="lbl" x="560" y="304" text-anchor="middle">temperatura →</text>

  <!-- nivells ON/OFF -->
  <text class="mut" x="80" y="125" text-anchor="end">ON</text>
  <text class="mut" x="80" y="245" text-anchor="end">OFF</text>

  <!-- llindars -->
  <line class="grid" x1="260" y1="70" x2="260" y2="280"/>
  <line class="grid" x1="400" y1="70" x2="400" y2="280"/>
  <text class="mut" x="260" y="298" text-anchor="middle">llindar baix</text>
  <text class="mut" x="400" y="298" text-anchor="middle">llindar alt</text>

  <!-- Loop d'histèresi (sentit antihorari) -->
  <!-- top ON: de Tmin a Tmax cap a la dreta -->
  <line class="loop" x1="264" y1="120" x2="392" y2="120" marker-end="url(#lp)"/>
  <!-- baixa a Tmax -->
  <line class="loop" x1="400" y1="124" x2="400" y2="236" marker-end="url(#lp)"/>
  <!-- bottom OFF: de Tmax a Tmin cap a l'esquerra -->
  <line class="loop" x1="396" y1="240" x2="268" y2="240" marker-end="url(#lp)"/>
  <!-- puja a Tmin -->
  <line class="loop" x1="260" y1="236" x2="260" y2="124" marker-end="url(#lp)"/>

  <!-- zona morta -->
  <rect x="260" y="130" width="140" height="100" fill="#0891b2" opacity="0.07"/>
  <text class="mut" x="330" y="182" text-anchor="middle">zona morta</text>
  <text class="mut" x="330" y="200" text-anchor="middle">(histèresi)</text>

  <text class="lbl" x="330" y="332" text-anchor="middle">Els dos llindars eviten que l'actuador s'encengui i s'apagui sense parar.</text>
</svg>
