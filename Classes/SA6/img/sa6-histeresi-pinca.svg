<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
  <title id="t">Histèresi de la pinça automàtica</title>
  <desc id="d">Gràfica de l'estat de la pinça segons la distància de l'objecte. Si l'objecte s'acosta, la pinça es tanca en passar per sota de 6 cm. Si s'allunya, només s'obre en passar per sobre de 10 cm. Entre 6 i 10 cm hi ha la finestra d'histèresi: la pinça manté l'estat que tenia.</desc>
  <style>
    .fr{fill:#f6faf9;stroke:#d7e6e5;stroke-width:1.5}
    .eix{stroke:#334155;stroke-width:2}
    .tanca{fill:none;stroke:#0891b2;stroke-width:4;stroke-linejoin:round}
    .obre{fill:none;stroke:#b45309;stroke-width:4;stroke-linejoin:round;stroke-dasharray:10 6}
    .ll{stroke:#64748b;stroke-width:1.5;stroke-dasharray:4 4}
    .fin{fill:#fef3c7;opacity:.7}
    .tit{font:700 16px system-ui,'Segoe UI',sans-serif;fill:#0e1b1c}
    .lbl{font:600 13px system-ui,'Segoe UI',sans-serif;fill:#0e1b1c}
    .lbl2{font:400 12px system-ui,'Segoe UI',sans-serif;fill:#475569}
    .bl{font:700 13px system-ui,'Segoe UI',sans-serif;fill:#0e7490}
    .or{font:700 13px system-ui,'Segoe UI',sans-serif;fill:#b45309}
  </style>
  <rect class="fr" x="1" y="1" width="718" height="418" rx="14"/>
  <text class="tit" x="24" y="34">Histèresi de la pinça: dos llindars, una memòria</text>
  <rect class="fin" x="261.0" y="100" width="114.0" height="210"/>
  <text class="lbl2" x="318.0" y="94" text-anchor="middle">finestra: manté l'estat</text>
  <line class="eix" x1="90" y1="320" x2="670" y2="320"/>
  <line class="eix" x1="90" y1="320" x2="90" y2="100"/>
  <text class="lbl" x="660" y="350" text-anchor="end">distància de l'objecte (cm)</text>
  <text class="lbl" x="80" y="135" text-anchor="end">tancada</text>
  <text class="lbl" x="80" y="295" text-anchor="end">oberta</text>
  <text class="lbl2" x="90.0" y="338" text-anchor="middle">0</text>
  <text class="lbl2" x="232.5" y="338" text-anchor="middle">5</text>
  <text class="lbl2" x="375.0" y="338" text-anchor="middle">10</text>
  <text class="lbl2" x="517.5" y="338" text-anchor="middle">15</text>
  <text class="lbl2" x="660.0" y="338" text-anchor="middle">20</text>
  <line class="ll" x1="261.0" y1="100" x2="261.0" y2="320"/>
  <text class="lbl2" x="261.0" y="376" text-anchor="middle">TANCA_CM = 6</text>
  <line class="ll" x1="375.0" y1="100" x2="375.0" y2="320"/>
  <text class="lbl2" x="375.0" y="376" text-anchor="middle">OBRE_CM = 10</text>
  <polyline class="tanca" points="660.0,286 261.0,286 261.0,126 90.0,126"/>
  <polygon points="460.5,286 472.5,280 472.5,292" fill="#0891b2"/>
  <text class="bl" x="517.5" y="276" text-anchor="middle">t'acostes</text>
  <polyline class="obre" points="90.0,134 375.0,134 375.0,294 660.0,294"/>
  <polygon points="187.5,134 175.5,128 175.5,140" fill="#b45309"/>
  <text class="or" x="175.5" y="156" text-anchor="middle">t'allunyes</text>
  <text class="lbl2" x="24" y="402">Amb un sol llindar, a la frontera la pinça faria clic-clic. Amb dos, el canvi depèn d'on venies.</text>
</svg>
