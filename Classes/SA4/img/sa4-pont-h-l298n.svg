<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" width="780" height="410" role="img" aria-labelledby="t d">
  <title id="t">Motor DC amb pont H L298N i massa comuna</title>
  <desc id="d">L'Arduino controla el L298N amb ENA (pin 5, velocitat per PWM), IN1 (pin 7) i IN2 (pin 8, direcció). El motor es connecta a OUT1 i OUT2. L'alimentació externa (piles) va a +12V. El punt clau: el GND de l'Arduino, el de les piles i el del L298N s'uneixen en una massa comuna.</desc>
  <style>
    .fr{fill:#f6faf9;stroke:#d7e6e5;stroke-width:1.5}
    .wire{fill:none;stroke-width:2.4}
    .ard{fill:#eaf3f2;stroke:#0891b2;stroke-width:1.8}
    .mod{fill:#0f766e;stroke:#0e1b1c;stroke-width:2}
    .pin{font:700 12px 'Consolas',monospace;fill:#0c6e70}
    .modpin{font:700 11px 'Consolas',monospace;fill:#eafffb}
    .lbl{font:700 13px system-ui,'Segoe UI',sans-serif;fill:#0e1b1c}
    .mut{font:600 12px system-ui,'Segoe UI',sans-serif;fill:#4f6d6e}
    .gndlbl{font:700 13px system-ui,sans-serif;fill:#b45309}
  </style>
  <rect class="fr" x="1" y="1" width="778" height="408" rx="14"/>

  <!-- Arduino -->
  <rect class="ard" x="28" y="40" width="140" height="150" rx="10"/>
  <text class="pin" x="98" y="66" text-anchor="middle">Arduino</text>
  <text class="pin" x="158" y="96" text-anchor="end">5~</text>
  <text class="pin" x="158" y="124" text-anchor="end">7</text>
  <text class="pin" x="158" y="152" text-anchor="end">8</text>
  <text class="pin" x="158" y="180" text-anchor="end">GND</text>

  <!-- L298N -->
  <rect class="mod" x="320" y="70" width="180" height="170" rx="10"/>
  <text x="410" y="96" text-anchor="middle" fill="#eafffb" style="font:700 14px system-ui,sans-serif">L298N (pont H)</text>
  <text class="modpin" x="330" y="126" text-anchor="start">ENA</text>
  <text class="modpin" x="330" y="154" text-anchor="start">IN1</text>
  <text class="modpin" x="330" y="182" text-anchor="start">IN2</text>
  <text class="modpin" x="410" y="230" text-anchor="middle">+12V   GND</text>
  <text class="modpin" x="490" y="140" text-anchor="end">OUT1</text>
  <text class="modpin" x="490" y="182" text-anchor="end">OUT2</text>

  <!-- Senyals Arduino -> L298N -->
  <path class="wire" stroke="#ca8a04" d="M168,90 H300 V120 H320"/>
  <path class="wire" stroke="#7c3aed" d="M168,118 H286 V148 H320"/>
  <path class="wire" stroke="#2563eb" d="M168,146 H272 V176 H320"/>
  <text class="mut" x="200" y="82" fill="#ca8a04">ENA · velocitat (PWM)</text>
  <text class="mut" x="200" y="252" fill="#0e1b1c">IN1 / IN2 · direcció</text>

  <!-- Motor -->
  <circle cx="640" cy="150" r="42" fill="#ffffff" stroke="#0e1b1c" stroke-width="2"/>
  <text x="640" y="156" text-anchor="middle" class="lbl">M</text>
  <text class="lbl" x="640" y="210" text-anchor="middle">Motor DC</text>
  <path class="wire" stroke="#0e1b1c" d="M500,132 H600" />
  <path class="wire" stroke="#0e1b1c" d="M500,176 H580 V186 H612" />

  <!-- Piles -->
  <rect x="40" y="300" width="130" height="56" rx="6" fill="#ffffff" stroke="#0e1b1c" stroke-width="2"/>
  <text class="lbl" x="105" y="332" text-anchor="middle">Piles</text>
  <text class="mut" x="52" y="350" fill="#dc2626">(+)</text>
  <text class="mut" x="150" y="350" fill="#0e1b1c">(−)</text>

  <!-- +12V de piles a L298N -->
  <path class="wire" stroke="#dc2626" d="M60,300 V270 H360 V240"/>
  <text class="mut" x="150" y="264" fill="#dc2626">+12V</text>

  <!-- MASSA COMUNA: Arduino GND + piles (-) + L298N GND -->
  <path class="wire" stroke="#b45309" d="M168,180 V376 H700"/>
  <path class="wire" stroke="#b45309" d="M158,344 V376"/>
  <path class="wire" stroke="#b45309" d="M430,240 V376"/>
  <!-- símbol GND al bus -->
  <line class="wire" stroke="#b45309" x1="700" y1="376" x2="700" y2="360"/>
  <line class="wire" stroke="#b45309" x1="682" y1="376" x2="718" y2="376"/>
  <line class="wire" stroke="#b45309" x1="689" y1="386" x2="711" y2="386"/>
  <line class="wire" stroke="#b45309" x1="695" y1="396" x2="705" y2="396"/>
  <text class="gndlbl" x="300" y="400" text-anchor="middle">⚠ MASSA COMUNA (uneix tots els GND)</text>
</svg>
