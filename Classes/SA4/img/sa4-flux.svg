<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 588" width="720" height="588" role="img" aria-labelledby="t d"><title id="t">Flux del braç amb potenciòmetres</title><desc id="d">Per a cada articulacio: es llegeix el potenciometre, es converteix al rang segur del servo i nomes es mou si el canvi supera la zona morta.</desc><style>
  .fr{fill:#f6faf9;stroke:#d7e6e5;stroke-width:1.5}
  .box{fill:#eaf3f2;stroke:#0891b2;stroke-width:1.8}
  .start{fill:#0891b2;stroke:#0e7490;stroke-width:1.8}
  .startt{font:700 14px system-ui,'Segoe UI',sans-serif;fill:#ffffff}
  .dec{fill:#fff7ed;stroke:#b45309;stroke-width:1.9}
  .boxt{font:600 13.5px system-ui,'Segoe UI',sans-serif;fill:#0e1b1c}
  .dect{font:700 13px system-ui,'Segoe UI',sans-serif;fill:#7c3a06}
  .wire{fill:none;stroke:#0891b2;stroke-width:2.3}
  .loop{fill:none;stroke:#b45309;stroke-width:2.3;stroke-dasharray:1 0}
  .lbl{font:700 12px system-ui,'Segoe UI',sans-serif;fill:#b45309}
  .yes{font:700 12px system-ui,'Segoe UI',sans-serif;fill:#0e7490}
</style><defs><marker id="m" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0891b2"/></marker><marker id="mo" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b45309"/></marker></defs><rect class="fr" x="1" y="1" width="718" height="586" rx="14"/><path class="wire" d="M360,98 L360,142" marker-end="url(#m)"/><path class="wire" d="M360,196 L360,240" marker-end="url(#m)"/><path class="wire" d="M360,294 L360,338" marker-end="url(#m)"/><rect class="start" x="210" y="46" width="300" height="52" rx="11"/><text class="startt" x="360" y="72" text-anchor="middle">Engego la placa</text><rect class="box" x="210" y="144" width="300" height="52" rx="11"/><text class="boxt" x="360" y="170" text-anchor="middle">setup(): write() abans d&#x27;attach()</text><rect class="box" x="210" y="242" width="300" height="52" rx="11"/><text class="boxt" x="360" y="260" text-anchor="middle">Llegeixo el potenciòmetre i el</text><text class="boxt" x="360" y="276" text-anchor="middle">passo al rang segur (map)</text><polygon class="dec" points="360,340 475,388 360,436 245,388"/><text class="dect" x="360" y="388" text-anchor="middle">canvi &gt; ZONA_MORTA ?</text><path class="wire" d="M360,436 L240,440" marker-end="url(#m)"/><rect x="229" y="428" width="22" height="18" rx="5" fill="#f6faf9"/><text class="yes" x="240" y="441" text-anchor="middle">SÍ</text><rect class="box" x="145" y="456" width="190" height="56" rx="11"/><text class="boxt" x="240" y="476" text-anchor="middle">Moc el servo i apunto</text><text class="boxt" x="240" y="492" text-anchor="middle">l&#x27;angle</text><path class="wire" d="M240,512 L240,534"/><path class="wire" d="M360,436 L480,440" marker-end="url(#m)"/><rect x="469" y="428" width="22" height="18" rx="5" fill="#f6faf9"/><text class="yes" x="480" y="441" text-anchor="middle">NO</text><rect class="box" x="385" y="456" width="190" height="56" rx="11"/><text class="boxt" x="480" y="484" text-anchor="middle">No faig res (és soroll)</text><path class="wire" d="M480,512 L480,534"/><path class="wire" d="M240,534 L480,534"/><path class="loop" d="M360,534 L180,534 L40,534 L40,268 L208,268" marker-end="url(#mo)"/><text class="lbl" x="48" y="401" transform="rotate(-90 48 401)" text-anchor="middle">cada articulació, cada volta</text></svg>