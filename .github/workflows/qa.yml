name: QA del material (enllaços, cobertura, hores, codi)

# Xarxa de seguretat: falla el push si hi ha enllaços trencats al web generat,
# una SA incompleta, hores que no quadren, errors de sintaxi als .py d'alumnat
# o sketches .ino que no compilen per a Arduino UNO.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-material:
    runs-on: ubuntu-latest
    steps:
      - name: Clona el repositori
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instal·la les dependències del generador
        run: pip install -r web/_generador/requirements.txt pytest

      - name: Genera el web
        run: python web/_generador/generar.py

      - name: Tests del generador
        run: python -m pytest web/_generador/tests -q

      - name: Genera els PDF (perquè el link-check els pugui verificar)
        run: python web/_generador/generar_pdf.py

      - name: QA (enllaços, cobertura de SA, hores, sintaxi Python)
        run: python tools/qa.py

  compilar-sketches:
    runs-on: ubuntu-latest
    steps:
      - name: Clona el repositori
        uses: actions/checkout@v4

      - name: Compila tots els sketches d'Arduino UNO
        uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:uno
          libraries: |
            - name: Servo
          sketch-paths: |
            - Classes/SA1/codi
            - Classes/SA2/codi
            - Classes/SA3/codi
            - Classes/SA4/codi
            - Classes/SA6/codi
            - Classes/SA7/codi
            - Reptes/Solucionari/SA1
            - Reptes/Solucionari/SA2
            - Reptes/Solucionari/SA3
            - Reptes/Solucionari/SA4
            - Reptes/Solucionari/SA6
            - Reptes/Solucionari/SA7
          # SA8/codi/04_esp32_telemetria és per a ESP32: vegeu el job compilar-esp32.
          # SA9: el codi el crea l'alumnat (només plantilla).
          # Solucionari SA5/SA8: MicroPython (.py), el vigila tools/qa.py (py_compile).
          verbose: false

  compilar-esp32:
    runs-on: ubuntu-latest
    steps:
      - name: Clona el repositori
        uses: actions/checkout@v4

      - name: Compila el sketch d'ESP32 (SA8, opcional al curs)
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          sketch-paths: |
            - Classes/SA8/codi/04_esp32_telemetria
            - Reptes/Solucionari/SA8/A_estacio_meteo_esp32
            - Simulacions/Validacio/SA8_A_wokwi/src
          verbose: false
